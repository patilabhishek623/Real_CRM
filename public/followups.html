<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Follow-Up Leads - Real_Crm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col antialiased selection:bg-emerald-500 selection:text-white">

    <header class="bg-white/80 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-30 transition-all">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-18 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-11 h-11 bg-gradient-to-tr from-emerald-600 to-teal-500 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-calendar-days text-lg"></i>
                </div>
                <div>
                    <span class="text-xl font-extrabold tracking-tight text-slate-900">Real_<span class="text-emerald-600">Crm</span></span>
                    <span class="block text-[10px] uppercase tracking-wider font-bold text-slate-400">Lead Management</span>
                </div>
            </div>
            <div class="flex items-center gap-3 sm:gap-4">
                <span id="activeUserBadge" class="hidden sm:inline-flex items-center text-xs font-semibold bg-slate-100 text-slate-700 px-3.5 py-2 rounded-xl border border-slate-200/60 shadow-2xs"></span>
                <a href="/" onclick="localStorage.clear()" class="group inline-flex items-center gap-2 px-4 py-2 bg-rose-50 hover:bg-rose-600 text-rose-600 hover:text-white font-semibold text-xs sm:text-sm rounded-xl transition-all duration-200 shadow-2xs">
                    <i class="fa-solid fa-right-from-bracket transition-transform group-hover:-translate-x-0.5"></i>
                    <span>Logout</span>
                </a>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-grow grid grid-cols-1 md:grid-cols-4 gap-8">
        
        <aside class="md:col-span-1 space-y-2">
            <div class="bg-white rounded-3xl border border-slate-200/80 p-4 shadow-sm/5 space-y-1.5 sticky top-24">
                <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400 px-3 py-1">Member Menu</p>
                
                <a href="teammember.html" class="flex items-center gap-3.5 px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 font-semibold rounded-xl text-sm transition group">
                    <i class="fa-solid fa-house w-5 text-slate-400 group-hover:text-emerald-600 transition text-base"></i> Dashboard
                </a>
                
                <a href="assignedmembertask.html" class="flex items-center gap-3.5 px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 font-semibold rounded-xl text-sm transition group">
                    <i class="fa-solid fa-list-check w-5 text-slate-400 group-hover:text-emerald-600 transition text-base"></i> Assigned Tasks
                    <span id="sidebarPendingCount" class="ml-auto bg-amber-50 text-amber-700 text-xs font-bold px-2 py-0.5 rounded-full border border-amber-200">0</span>
                </a>
                
                <a href="followups.html" class="flex items-center gap-3.5 px-4 py-3 bg-emerald-600 text-white font-bold rounded-xl text-sm shadow-sm shadow-emerald-500/20 transition">
                    <i class="fa-solid fa-calendar-days w-5 text-emerald-100 text-base"></i> Follow Ups
                    <span id="sidebarFollowupCount" class="ml-auto bg-white/20 text-white text-xs font-bold px-2.5 py-0.5 rounded-full">0</span>
                </a>
                
                <a href="visits.html" class="flex items-center gap-3.5 px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 font-semibold rounded-xl text-sm transition group">
                    <i class="fa-solid fa-map-location-dot w-5 text-slate-400 group-hover:text-emerald-600 transition text-base"></i> Visits
                    <span id="sidebarVisitCount" class="ml-auto bg-teal-50 text-teal-700 text-xs font-bold px-2.5 py-0.5 rounded-full border border-teal-200">0</span>
                </a>
            </div>
        </aside>

        <main class="md:col-span-3 space-y-6">
            <div class="bg-white rounded-3xl border border-slate-200/80 p-6 sm:p-8 shadow-sm/5">
                
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-6 border-b border-slate-100">
                    <div>
                        <h1 class="text-xl sm:text-2xl font-bold text-slate-900">Scheduled Follow-Ups</h1>
                        <p class="text-xs sm:text-sm text-slate-500 mt-1">Click any lead name to record call connection status and remarks[cite: 1].</p>
                    </div>
                    <div id="followupCountBadge" class="inline-flex items-center gap-2 px-3.5 py-1.5 bg-emerald-50 text-emerald-700 font-bold rounded-xl text-xs border border-emerald-200/60 shadow-2xs">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span>0 Active Follow-ups</span>
                    </div>
                </div>

                <!-- Reordered Tabs: Today first, then Tomorrow, Other, and Lapsed -->
                <div class="flex flex-wrap gap-2 mt-6">
                    <button onclick="switchTab('today')" id="tab-today" class="px-4 py-2 text-xs font-bold rounded-xl border transition flex items-center gap-2 bg-emerald-600 text-white border-emerald-600 shadow-sm">
                        <span>Today</span>
                        <span id="badge-today" class="bg-white/20 px-2 py-0.5 rounded-full text-[10px]">0</span>
                    </button>
                    <button onclick="switchTab('tomorrow')" id="tab-tomorrow" class="px-4 py-2 text-xs font-bold rounded-xl border transition flex items-center gap-2 bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200">
                        <span>Tomorrow</span>
                        <span id="badge-tomorrow" class="bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full text-[10px]">0</span>
                    </button>
                    <button onclick="switchTab('other')" id="tab-other" class="px-4 py-2 text-xs font-bold rounded-xl border transition flex items-center gap-2 bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200">
                        <span>Other / Upcoming</span>
                        <span id="badge-other" class="bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full text-[10px]">0</span>
                    </button>
                    <button onclick="switchTab('lapsed')" id="tab-lapsed" class="px-4 py-2 text-xs font-bold rounded-xl border transition flex items-center gap-2 bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200">
                        <span>Lapsed Calls</span>
                        <span id="badge-lapsed" class="bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full text-[10px]">0</span>
                    </button>
                </div>

                <div class="overflow-x-auto mt-6">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-100 text-[11px] font-bold uppercase tracking-wider text-slate-400">
                                <th class="py-3.5 px-4">Lead Name</th>
                                <th class="py-3.5 px-4">Contact Number</th>
                                <th class="py-3.5 px-4">Follow-Up Option</th>
                                <th class="py-3.5 px-4">Date & Time</th>
                            </tr>
                        </thead>
                        <tbody id="followupTableBody" class="divide-y divide-slate-100 text-sm">
                            <tr>
                                <td colspan="4" class="text-center py-12 text-slate-400">
                                    <div class="inline-block animate-spin rounded-full h-6 w-6 border-2 border-emerald-500 border-t-transparent mb-2"></div>
                                    <p class="text-xs font-medium">Loading follow-ups...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const currentUsername = localStorage.getItem('crm_username');
        if (!currentUsername) {
            alert('No active session found. Please log in again.');
            window.location.href = '/';
        }

        document.getElementById('activeUserBadge').innerHTML = `<i class="fa-solid fa-user-shield text-emerald-600 mr-1.5"></i> User: <b class="text-slate-900 ml-1">${currentUsername}</b>`;

        let globalFollowupTasks = [];
        let currentActiveTab = 'today'; // Default selected view is Today[cite: 1]

        function formatDateString(date) {
            const d = new Date(date);
            let month = '' + (d.getMonth() + 1);
            let day = '' + d.getDate();
            let year = d.getFullYear();
            if (month.length < 2) month = '0' + month;
            if (day.length < 2) day = '0' + day;
            return [year, month, day].join('-');
        }

        function parseTaskTargetDate(t) {
            let dateStr = t.followUpDate || '';
            let timeStr = t.followUpTime || '00:00';

            if (dateStr.length > 10 && dateStr.includes(':')) {
                const parts = dateStr.match(/^(\d{4}-\d{2}-\d{2})(\d{2}:\d{2})$/);
                if (parts) {
                    dateStr = parts[1];
                    timeStr = parts[2];
                }
            }

            return new Date(`${dateStr}T${timeStr}:00`);
        }

        function getLapsedDetails(targetDate) {
            const now = new Date();
            const diffMs = now - targetDate;
            if (diffMs <= 0) return null;

            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            const diffHours = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

            if (diffDays > 0) {
                return `${diffDays}d ${diffHours}h Lapsed`;
            } else {
                return `${diffHours}h Lapsed`;
            }
        }

        function switchTab(tab) {
            currentActiveTab = tab;
            ['today', 'tomorrow', 'other', 'lapsed'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.className = "px-4 py-2 text-xs font-bold rounded-xl border transition flex items-center gap-2 bg-emerald-600 text-white border-emerald-600 shadow-sm";
                } else {
                    btn.className = "px-4 py-2 text-xs font-bold rounded-xl border transition flex items-center gap-2 bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200";
                }
            });
            renderTable();
        }

        function renderTable() {
            const now = new Date();
            const todayStr = formatDateString(now);
            
            const tomorrowDate = new Date();
            tomorrowDate.setDate(tomorrowDate.getDate() + 1);
            const tomorrowStr = formatDateString(tomorrowDate);

            const lapsedTasks = [];
            const todayTasks = [];
            const tomorrowTasks = [];
            const otherTasks = [];

            globalFollowupTasks.forEach(t => {
                const targetDate = parseTaskTargetDate(t);
                const dStr = formatDateString(targetDate);

                if (targetDate < now) {
                    lapsedTasks.push(t);
                } else if (dStr === todayStr) {
                    todayTasks.push(t);
                } else if (dStr === tomorrowStr) {
                    tomorrowTasks.push(t);
                } else {
                    otherTasks.push(t);
                }
            });

            document.getElementById('badge-today').textContent = todayTasks.length;
            document.getElementById('badge-tomorrow').textContent = tomorrowTasks.length;
            document.getElementById('badge-other').textContent = otherTasks.length;
            document.getElementById('badge-lapsed').textContent = lapsedTasks.length;

            let activeList = todayTasks;
            if (currentActiveTab === 'tomorrow') activeList = tomorrowTasks;
            if (currentActiveTab === 'other') activeList = otherTasks;
            if (currentActiveTab === 'lapsed') activeList = lapsedTasks;

            const tbody = document.getElementById('followupTableBody');
            if (activeList.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center py-16 text-slate-400">
                            <div class="w-12 h-12 bg-slate-50 text-slate-300 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-slate-100">
                                <i class="fa-solid fa-clipboard-check text-xl"></i>
                            </div>
                            <p class="text-sm font-semibold text-slate-700">No records found!</p>
                            <p class="text-xs text-slate-400 mt-0.5">There are no follow-ups found in ${currentActiveTab}.</p>
                        </td>
                    </tr>`;
                return;
            }

            tbody.innerHTML = activeList.map(t => {
                const targetDate = parseTaskTargetDate(t);
                const lapsedLabel = getLapsedDetails(targetDate);
                const taskId = t._id || t.id;

                return `
                    <tr class="hover:bg-slate-50/60 transition-colors group">
                        <td class="py-4 px-4">
                            <a href="lead-response.html?id=${taskId}" class="font-semibold text-slate-900 hover:text-emerald-600 transition-colors underline decoration-slate-300 hover:decoration-emerald-500">${t.name}[cite: 1]</a>
                        </td>
                        <td class="py-4 px-4 text-slate-600">
                            ${t.contactNumber ? `<a href="tel:${t.contactNumber}" class="inline-flex items-center gap-1.5 hover:text-emerald-600 transition"><i class="fa-solid fa-phone text-xs text-slate-400"></i> ${t.contactNumber}</a>` : '<span class="text-slate-400 italic">N/A</span>'}
                        </td>
                        <td class="py-4 px-4">
                            <span class="inline-flex items-center gap-1.5 px-3 py-1 bg-amber-50/80 text-amber-700 font-semibold rounded-xl text-xs border border-amber-200/60 shadow-2xs">
                                <i class="fa-solid fa-tag text-[10px] text-amber-500"></i>
                                ${t.followUpOption || 'Standard Follow-Up'}
                            </span>
                        </td>
                        <td class="py-4 px-4 text-slate-600">
                            <div class="inline-flex items-center gap-2 font-medium flex-wrap">
                                <span class="bg-slate-100 text-slate-700 px-2.5 py-1 rounded-lg text-xs">${t.followUpDate || 'Not Set'}</span>
                                <span class="text-xs text-slate-400 font-normal">${t.followUpTime || ''}</span>
                                ${lapsedLabel ? `<span class="bg-rose-50 text-rose-600 font-bold px-2 py-0.5 rounded text-[10px] border border-rose-200 ml-1"><i class="fa-solid fa-clock-rotate-left mr-1"></i>${lapsedLabel}</span>` : ''}
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function loadFollowUps() {
            try {
                const res = await fetch(`/api/member-tasks/${encodeURIComponent(currentUsername)}`);
                const data = await res.json();
                
                if (data.success && data.tasks) {
                    const tasks = data.tasks;
                    globalFollowupTasks = tasks.filter(t => t.followUpRequired && t.followUpRequired.toLowerCase() === 'yes');
                    const pendingTasks = tasks.filter(t => !t.status || t.status.toLowerCase() !== 'completed');
                    const visitTasks = tasks.filter(t => t.visitRequired && t.visitRequired.toLowerCase() === 'yes');

                    document.getElementById('sidebarPendingCount').textContent = pendingTasks.length;
                    document.getElementById('sidebarFollowupCount').textContent = globalFollowupTasks.length;
                    document.getElementById('sidebarVisitCount').textContent = visitTasks.length;

                    document.getElementById('followupCountBadge').innerHTML = `
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span>${globalFollowupTasks.length} Active Follow-ups</span>
                    `;

                    renderTable();
                }
            } catch (err) {
                console.error('Error loading follow-ups:', err);
                document.getElementById('followupTableBody').innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center py-12 text-rose-500">
                            <i class="fa-solid fa-circle-exclamation text-xl mb-1"></i>
                            <p class="text-xs font-medium">Failed to load follow-up records. Please refresh the page.</p>
                        </td>
                    </tr>`;
            }
        }

        loadFollowUps();
    </script>
</body>
</html>
