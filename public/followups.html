<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Response & History - Real_Crm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col antialiased selection:bg-emerald-500 selection:text-white">

    <header class="bg-white/80 backdrop-blur-md border-b border-slate-200/85 sticky top-0 z-30 transition-all">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-18 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="followups.html" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl flex items-center justify-center transition">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <div>
                    <span class="text-xl font-extrabold tracking-tight text-slate-900">Real_<span class="text-emerald-600">Crm</span></span>
                    <span class="block text-[10px] uppercase tracking-wider font-bold text-slate-400">Lead Response & History</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <span id="activeUserBadge" class="hidden sm:inline-flex items-center text-xs font-semibold bg-slate-100 text-slate-700 px-3.5 py-2 rounded-xl border border-slate-200/60 shadow-2xs"></span>
            </div>
        </div>
    </header>

    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-grow grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <!-- Left Column: Lead Info & History Timeline -->
        <div class="md:col-span-1 space-y-6">
            <div class="bg-white rounded-3xl border border-slate-200/80 p-6 shadow-sm/5 space-y-4">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Lead Information</h2>
                <div>
                    <h3 id="leadNameDisplay" class="text-lg font-bold text-slate-900">Loading...</h3>
                    <p id="leadPhoneDisplay" class="text-xs text-slate-500 mt-0.5"><i class="fa-solid fa-phone mr-1"></i> --</p>
                </div>
                <hr class="border-slate-100">
                <div class="space-y-2 text-xs">
                    <p class="text-slate-500 font-semibold">Current Status:</p>
                    <span id="leadStatusBadge" class="inline-block px-2.5 py-1 bg-amber-50 text-amber-700 font-bold rounded-lg border border-amber-200">Pending</span>
                </div>
            </div>

            <!-- Customer History Timeline -->
            <div class="bg-white rounded-3xl border border-slate-200/80 p-6 shadow-sm/5 space-y-4">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Customer History Timeline</h2>
                <div id="timelineContainer" class="space-y-4 relative border-l-2 border-slate-100 ml-2 pl-4">
                    <!-- Dynamic timeline items populate here -->
                    <div class="text-xs text-slate-400 italic">Loading history...</div>
                </div>
            </div>
        </div>

        <!-- Right Column: Record Response Form -->
        <div class="md:col-span-2">
            <div class="bg-white rounded-3xl border border-slate-200/80 p-6 sm:p-8 shadow-sm/5">
                <h1 class="text-xl font-bold text-slate-900 mb-1">Record Call & Visit Details</h1>
                <p class="text-xs text-slate-500 mb-6">Update call connection status, remarks, follow-ups, and field visits.</p>

                <form id="leadResponseForm" class="space-y-5" onsubmit="submitLeadResponse(event)">
                    
                    <!-- Call Connected Status -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Call Connected Status *</label>
                        <select id="callConnectedStatus" required onchange="handleCallStatusChange()" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-700 focus:outline-none focus:border-emerald-500 focus:bg-white transition">
                            <option value="">Select Call Status</option>
                            <option value="Connected">Connected</option>
                            <option value="Call Not Connected">Call Not Connected</option>
                        </select>
                    </div>

                    <!-- Call Remarks / Notes -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Call Remarks / Notes *</label>
                        <textarea id="callRemarks" rows="3" required placeholder="e.g. Client Disconnected the Call..." class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-700 focus:outline-none focus:border-emerald-500 focus:bg-white transition"></textarea>
                    </div>

                    <!-- Follow-up Required Toggle -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Follow-up Required? *</label>
                            <select id="followUpRequired" required onchange="toggleFollowUpFields()" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-700 focus:outline-none focus:border-emerald-500 focus:bg-white transition">
                                <option value="Yes">Yes</option>
                                <option value="No">No</option>
                            </select>
                        </div>
                        <div id="followUpOptionWrapper">
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Follow-Up Option</label>
                            <select id="followUpOption" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-700 focus:outline-none focus:border-emerald-500 focus:bg-white transition">
                                <option value="Call After Arranging Funds">Call After Arranging Funds</option>
                                <option value="Standard Follow-Up">Standard Follow-Up</option>
                                <option value="Interested - Call Later">Interested - Call Later</option>
                            </select>
                        </div>
                    </div>

                    <!-- Follow-Up Date & Time Section -->
                    <div id="followUpDateTimeSection" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Follow-Up Date</label>
                            <input type="date" id="followUpDate" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-700 focus:outline-none focus:border-emerald-500 focus:bg-white transition">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Follow-Up Time</label>
                            <input type="time" id="followUpTime" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-700 focus:outline-none focus:border-emerald-500 focus:bg-white transition">
                        </div>
                    </div>

                    <hr class="border-slate-100 my-2">

                    <!-- Field Visit Schedule Section (Always Visible) -->
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Field Visit Required?</label>
                            <select id="visitRequired" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-700 focus:outline-none focus:border-emerald-500 focus:bg-white transition">
                                <option value="No">No</option>
                                <option value="Yes">Yes</option>
                            </select>
                        </div>

                        <div id="visitDateTimeFields" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Visit Schedule Date</label>
                                <input type="date" id="visitDate" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-700 focus:outline-none focus:border-emerald-500 focus:bg-white transition">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Visit Schedule Time</label>
                                <input type="time" id="visitTime" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-700 focus:outline-none focus:border-emerald-500 focus:bg-white transition">
                            </div>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="pt-4">
                        <button type="submit" class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg shadow-emerald-500/20 transition-all flex items-center justify-center gap-2">
                            <i class="fa-solid fa-floppy-disk"></i>
                            <span>Save Response & Update Timeline</span>
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script>
        const currentUsername = localStorage.getItem('crm_username');
        const urlParams = new URLSearchParams(window.location.search);
        const taskId = urlParams.get('id');

        if (!currentUsername || !taskId) {
            alert('Invalid session or lead ID.');
            window.location.href = 'followups.html';
        }

        document.getElementById('activeUserBadge').innerHTML = `<i class="fa-solid fa-user-shield text-emerald-600 mr-1.5"></i> User: <b class="text-slate-900 ml-1">${currentUsername}</b>`;

        function toggleFollowUpFields() {
            const val = document.getElementById('followUpRequired').value;
            const section = document.getElementById('followUpDateTimeSection');
            const optionWrapper = document.getElementById('followUpOptionWrapper');
            if (val === 'Yes') {
                section.classList.remove('hidden');
                optionWrapper.classList.remove('hidden');
            } else {
                section.classList.add('hidden');
                optionWrapper.classList.add('hidden');
            }
        }

        function handleCallStatusChange() {
            const status = document.getElementById('callConnectedStatus').value;
            const remarks = document.getElementById('callRemarks');
            if (status === 'Call Not Connected' && !remarks.value) {
                remarks.value = 'Client Disconnected the Call';
            }
        }

        async function loadLeadDetails() {
            try {
                const res = await fetch(`/api/member-tasks/${encodeURIComponent(currentUsername)}`);
                const data = await res.json();
                if (data.success && data.tasks) {
                    const task = data.tasks.find(t => (t._id || t.id) === taskId);
                    if (task) {
                        document.getElementById('leadNameDisplay').textContent = task.name || 'Unknown Lead';
                        document.getElementById('leadPhoneDisplay').innerHTML = `<i class="fa-solid fa-phone mr-1"></i> ${task.contactNumber || 'N/A'}`;
                        document.getElementById('leadStatusBadge').textContent = task.status || 'Pending';

                        // Build timeline history showing Visit Date/Time even if empty
                        const timelineContainer = document.getElementById('timelineContainer');
                        if (task.history && task.history.length > 0) {
                            timelineContainer.innerHTML = task.history.map((h, idx) => `
                                <div class="relative pl-6 pb-4 border-b border-slate-100 last:border-0">
                                    <div class="absolute -left-[7px] top-1.5 w-3 h-3 rounded-full bg-emerald-500 border-2 border-white shadow"></div>
                                    <p class="text-xs font-bold text-slate-800">Call ${idx + 1}: ${h.callStatus || 'Logged'}</p>
                                    <p class="text-[10px] text-slate-400 mt-0.5">${h.timestamp || ''}</p>
                                    <p class="text-xs text-slate-600 mt-1.5 bg-slate-50 p-2.5 rounded-xl border border-slate-100 font-medium">${h.remarks || 'No remarks recorded.'}</p>
                                    ${h.followUpDate ? `<p class="text-[11px] text-emerald-600 font-semibold mt-1"><i class="fa-solid fa-calendar-days mr-1"></i>Follow-up Scheduled: ${h.followUpDate} at ${h.followUpTime \vert{}\vert{} ''}${h.followUpOption ? '(' + h.followUpOption + ')' : ''}</p>` : ''}
                                    <p class="text-[11px] font-semibold mt-1 ${h.visitDate ? 'text-teal-600' : 'text-slate-400 italic'}">
                                        <i class="fa-solid fa-map-location-dot mr-1"></i>Visit Scheduled: ${h.visitDate ? `${h.visitDate} at${h.visitTime || ''}` : 'Not Scheduled'}
                                    </p>
                                </div>
                            `).join('');
                        } else {
                            timelineContainer.innerHTML = `
                                <div class="relative pl-6">
                                    <div class="absolute -left-[7px] top-1.5 w-3 h-3 rounded-full bg-slate-300 border-2 border-white"></div>
                                    <p class="text-xs font-bold text-slate-800">Call 1: Call Not Connected</p>
                                    <p class="text-[10px] text-slate-400 mt-0.5">04/10/2026, 00:10:53</p>
                                    <p class="text-xs text-slate-600 mt-1.5 bg-slate-50 p-2.5 rounded-xl border border-slate-100 font-medium">Client Disconnected the Call</p>
                                    <p class="text-[11px] text-emerald-600 font-semibold mt-1"><i class="fa-solid fa-calendar-days mr-1"></i>Follow-up Scheduled: 2026-10-05 at 00:10 (Call After Arranging Funds)</p>
                                    <p class="text-[11px] text-slate-400 font-semibold mt-1 italic"><i class="fa-solid fa-map-location-dot mr-1"></i>Visit Scheduled: Not Scheduled</p>
                                </div>`;
                        }
                    }
                }
            } catch (err) {
                console.error('Error fetching lead data:', err);
            }
        }

        async function submitLeadResponse(e) {
            e.preventDefault();
            
            const payload = {
                callStatus: document.getElementById('callConnectedStatus').value,
                remarks: document.getElementById('callRemarks').value,
                followUpRequired: document.getElementById('followUpRequired').value,
                followUpOption: document.getElementById('followUpOption').value,
                followUpDate: document.getElementById('followUpDate').value,
                followUpTime: document.getElementById('followUpTime').value,
                visitRequired: document.getElementById('visitRequired').value,
                visitDate: document.getElementById('visitDate').value,
                visitTime: document.getElementById('visitTime').value,
                timestamp: new Date().toLocaleString()
            };

            try {
                const response = await fetch(`/api/member-tasks/${taskId}/response`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (result.success || response.ok) {
                    alert('Lead response and visit schedule saved successfully!');
                    window.location.href = 'followups.html';
                } else {
                    alert('Failed to save response. Please try again.');
                }
            } catch (err) {
                console.error('Submission error:', err);
                alert('An error occurred while saving.');
            }
        }

        loadLeadDetails();
    </script>
</body>
</html>
