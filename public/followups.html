<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Response & History - Real_Crm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col antialiased selection:bg-emerald-500 selection:text-white">

    <!-- Header -->
    <header class="bg-white/85 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-30 transition-all">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-18 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-11 h-11 bg-gradient-to-tr from-emerald-600 to-teal-500 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-headset text-lg"></i>
                </div>
                <div>
                    <span class="text-xl font-extrabold tracking-tight text-slate-900">Real_<span class="text-emerald-600">Crm</span> Hub</span>
                    <span class="block text-[10px] uppercase tracking-wider font-bold text-slate-400">Lead Interaction</span>
                </div>
            </div>
            <div class="flex items-center gap-3 sm:gap-4">
                <span id="activeUserBadge" class="hidden sm:inline-flex items-center text-xs font-semibold bg-slate-100 text-slate-700 px-3.5 py-2 rounded-xl border border-slate-200/60 shadow-2xs"></span>
                <a href="followups.html" class="inline-flex items-center gap-2 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs sm:text-sm rounded-xl transition-all">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Back to Follow-Ups</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-grow grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Left Column: Lead Info & Call Input Wizard -->
        <div class="lg:col-span-1 space-y-6">
            <!-- Lead Profile Card -->
            <div class="bg-white rounded-3xl border border-slate-200/80 p-6 shadow-sm/5 space-y-4">
                <div>
                    <h2 id="leadNameHeader" class="text-xl font-bold text-slate-900">Loading Lead...</h2>
                    <p id="leadContactHeader" class="text-sm text-emerald-600 font-semibold mt-0.5"><i class="fa-solid fa-phone text-xs mr-1"></i> --</p>
                </div>
                <div class="border-t border-slate-100 pt-4 space-y-2.5 text-xs">
                    <div class="flex justify-between">
                        <span class="text-slate-400 font-medium">Lead Source:</span>
                        <span id="leadSourceVal" class="font-semibold text-slate-700">--</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-slate-400 font-medium">Account Status:</span>
                        <span id="leadStatusVal" class="inline-flex px-2 py-0.5 bg-emerald-50 text-emerald-700 font-bold rounded-md">Active Pipeline</span>
                    </div>
                </div>
            </div>

            <!-- Call Input Wizard Form -->
            <div class="bg-white rounded-3xl border border-slate-200/80 p-6 shadow-sm/5">
                <h3 class="text-base font-bold text-slate-900 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-phone-volume text-emerald-600"></i> Call Input Wizard
                </h3>
                
                <form id="callLogForm" class="space-y-4 text-xs">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1.5">1. Was the call connected?</label>
                        <select id="callConnectedSelect" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 font-medium text-slate-700">
                            <option value="">Select connection status...</option>
                            <option value="Yes, Connected">Yes, Connected</option>
                            <option value="Call Not Connected">No, Not Connected</option>
                        </select>
                    </div>

                    <div>
                        <label class="block font-bold text-slate-700 mb-1.5">Call Remarks / Notes</label>
                        <textarea id="callRemarkInput" rows="3" placeholder="Enter remarks or notes about the call..." class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-700 font-medium"></textarea>
                    </div>

                    <div>
                        <label class="block font-bold text-slate-700 mb-1.5">Follow-up Required?</label>
                        <select id="followUpRequiredSelect" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 font-medium text-slate-700">
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>

                    <div>
                        <label class="block font-bold text-slate-700 mb-1.5">Follow-Up Option</label>
                        <input type="text" id="followUpOptionInput" placeholder="e.g. Call After Arranging Funds" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 font-medium text-slate-700">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block font-bold text-slate-700 mb-1.5">Follow-Up Date</label>
                            <input type="date" id="followUpDateInput" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 font-medium text-slate-700">
                        </div>
                        <div>
                            <label class="block font-bold text-slate-700 mb-1.5">Follow-Up Time</label>
                            <input type="time" id="followUpTimeInput" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 font-medium text-slate-700">
                        </div>
                    </div>

                    <button type="submit" class="w-full mt-2 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md shadow-emerald-500/20 transition-all text-sm">
                        Save Call Response
                    </button>
                </form>
            </div>
        </div>

        <!-- Right Column: Customer History Timeline -->
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-white rounded-3xl border border-slate-200/80 p-6 sm:p-8 shadow-sm/5">
                <div class="flex items-center justify-between pb-6 border-b border-slate-100 mb-6">
                    <div>
                        <h2 class="text-xl font-bold text-slate-900">Customer History Timeline</h2>
                        <p class="text-xs text-slate-500 mt-0.5">Chronological log of calls, remarks, and scheduled follow-ups.</p>
                    </div>
                </div>

                <!-- Timeline Container -->
                <div id="customerTimelineContainer" class="space-y-6 relative">
                    <div class="text-center py-12 text-slate-400">
                        <div class="inline-block animate-spin rounded-full h-6 w-6 border-2 border-emerald-500 border-t-transparent mb-2"></div>
                        <p class="text-xs font-medium">Loading interaction history...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-200/60 mt-auto">
        Real Estate CRM &copy; 2026
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const currentUsername = localStorage.getItem('crm_username');
        if (!currentUsername) {
            alert('No active session found. Please log in again.');
            window.location.href = '/';
        }

        document.getElementById('activeUserBadge').innerHTML = `<i class="fa-solid fa-user-shield text-emerald-600 mr-1.5"></i> User: <b class="text-slate-900 ml-1">${currentUsername}</b>`;

        const urlParams = new URLSearchParams(window.location.search);
        const leadId = urlParams.get('id');

        let currentLeadData = null;

        async function loadLeadDetails() {
            if (!leadId) {
                alert('No Lead ID specified.');
                window.location.href = 'followups.html';
                return;
            }

            try {
                const res = await fetch(`/api/member-tasks/${encodeURIComponent(currentUsername)}`);
                const data = await res.json();

                if (data.success && data.tasks) {
                    currentLeadData = data.tasks.find(t => (t._id || t.id) == leadId);
                    
                    if (currentLeadData) {
                        document.getElementById('leadNameHeader').textContent = currentLeadData.name || 'Unnamed Lead';
                        document.getElementById('leadContactHeader').innerHTML = `<i class="fa-solid fa-phone text-xs mr-1"></i> ${currentLeadData.contactNumber || 'N/A'}`;
                        document.getElementById('leadSourceVal').textContent = currentLeadData.leadSource || 'Imported via Excel spreadsheet upload.';
                        
                        const historyLogs = currentLeadData.history || currentLeadData.logs || [
                            {
                                title: currentLeadData.title || "Call Log",
                                call_connected: currentLeadData.call_connected || "",
                                remark: currentLeadData.remark || "",
                                followUpRequired: currentLeadData.followUpRequired || "",
                                followUpOption: currentLeadData.followUpOption || "",
                                followUpDate: currentLeadData.followUpDate || "",
                                followUpTime: currentLeadData.followUpTime || "",
                                visitScheduled: currentLeadData.visitScheduled || "",
                                visitDate: currentLeadData.visitDate || "",
                                visitTime: currentLeadData.visitTime || "",
                                visitBuilding: currentLeadData.visitBuilding || "",
                                visitLocation: currentLeadData.visitLocation || "",
                                visitNote: currentLeadData.visitNote || "",
                                leadStatus: currentLeadData.leadStatus || "",
                                closeReason: currentLeadData.closeReason || "",
                                timestamp: currentLeadData.timestamp || "04/10/2026, 00:10:53"
                            }
                        ];

                        renderCustomerTimeline(historyLogs);
                    } else {
                        document.getElementById('customerTimelineContainer').innerHTML = `<div class="text-xs text-rose-500 font-semibold text-center py-8">Lead record not found.</div>`;
                    }
                }
            } catch (err) {
                console.error('Error loading lead details:', err);
                document.getElementById('customerTimelineContainer').innerHTML = `<div class="text-xs text-rose-500 font-semibold text-center py-8">Failed to load lead history.</div>`;
            }
        }

        function renderCustomerTimeline(historyLogs) {
            const timelineContainer = document.getElementById('customerTimelineContainer');
            
            if (!historyLogs || historyLogs.length === 0) {
                timelineContainer.innerHTML = `
                    <div class="text-xs text-slate-400 italic py-4 text-center">No activity history recorded yet.</div>
                `;
                return;
            }

            timelineContainer.innerHTML = historyLogs.map(log => {
                const callConn = log.call_connected ? log.call_connected.trim() : "";
                const isConnected = callConn.toLowerCase().includes('connected') && !callConn.toLowerCase().includes('not');
                const badgeClass = callConn 
                    ? (isConnected ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-rose-50 text-rose-600 border-rose-200')
                    : 'bg-slate-100 text-slate-500 border-slate-200';
                
                const iconClass = callConn ? (isConnected ? 'fa-phone' : 'fa-phone-slash') : 'fa-circle-question';

                // Helper to check if a value is empty
                const valOrEmpty = (val) => (val && val.trim() !== '') ? val : '<span class="text-slate-400 italic font-normal">Empty</span>';

                return `
                    <div class="relative pl-6 pb-6 border-l-2 border-slate-200 last:border-none last:pb-0">
                        <div class="absolute -left-[17px] top-0 w-8 h-8 rounded-full bg-white border-2 border-slate-200 flex items-center justify-center text-slate-600 text-xs shadow-2xs">
                            <i class="fa-solid ${iconClass}"></i>
                        </div>

                        <div class="bg-white rounded-2xl border border-slate-200/80 p-4 shadow-2xs space-y-3">
                            <!-- Title & Timestamp Header -->
                            <div class="flex items-center justify-between flex-wrap gap-2">
                                <span class="text-xs font-bold uppercase tracking-wider text-slate-700">
                                    ${valOrEmpty(log.title)}
                                </span>
                                <span class="text-[11px] text-slate-400 font-medium">
                                    ${valOrEmpty(log.timestamp || log.createdAt)}
                                </span>
                            </div>

                            <!-- Call Connection Status -->
                            <div>
                                <span class="text-[11px] font-bold text-slate-400 block mb-1">Call Connection Status:</span>
                                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-semibold border ${badgeClass}">
                                    <i class="fa-solid ${iconClass} text-[10px]"></i>
                                    ${valOrEmpty(log.call_connected)}
                                </span>
                            </div>

                            <!-- Call Remarks / Notes -->
                            <div class="text-xs text-slate-600 bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                                <span class="font-bold text-slate-700 block mb-0.5"><i class="fa-solid fa-comment-dots text-emerald-600 mr-1"></i> Call Remarks / Notes:</span>
                                <p class="text-slate-600">${valOrEmpty(log.remark)}</p>
                            </div>

                            <!-- Follow-up Details Info Box -->
                            <div class="text-xs text-amber-800 bg-amber-50/70 p-2.5 rounded-xl border border-amber-200/60 space-y-1">
                                <div class="font-bold flex items-center gap-1 text-amber-900">
                                    <i class="fa-solid fa-calendar-days text-amber-600"></i> Follow-up Required: <span class="font-normal">${valOrEmpty(log.followUpRequired)}</span>
                                </div>
                                <div class="text-slate-700 font-medium pl-4 space-y-0.5">
                                    <div>Option: ${valOrEmpty(log.followUpOption)}</div>
                                    <div>Schedule: ${log.followUpDate || log.followUpTime ? `${log.followUpDate \vert{}\vert{} 'Empty'} at${log.followUpTime || 'Empty'}` : '<span class="text-slate-400 italic">Empty</span>'}</div>
                                </div>
                            </div>

                            <!-- Visit Details Info Box -->
                            <div class="text-xs text-teal-800 bg-teal-50/70 p-2.5 rounded-xl border border-teal-200/60 space-y-1">
                                <div class="font-bold flex items-center gap-1 text-teal-900">
                                    <i class="fa-solid fa-map-location-dot text-teal-600"></i> Visit Scheduled: <span class="font-normal">${valOrEmpty(log.visitScheduled)}</span>
                                </div>
                                <div class="text-slate-700 font-medium pl-4 space-y-0.5">
                                    <div>Date & Time: ${log.visitDate || log.visitTime ? `${log.visitDate \vert{}\vert{} 'Empty'} at${log.visitTime || 'Empty'}` : '<span class="text-slate-400 italic">Empty</span>'}</div>
                                    <div>Building/Location: ${log.visitBuilding || log.visitLocation ? `${log.visitBuilding \vert{}\vert{} ''}${log.visitLocation || ''}` : '<span class="text-slate-400 italic">Empty</span>'}</div>
                                    <div>Visit Note: ${valOrEmpty(log.visitNote)}</div>
                                </div>
                            </div>

                            <!-- Lead Status / Close Reason Footer Tag -->
                            <div class="pt-1 flex items-center gap-3 text-[11px] text-slate-500 font-medium flex-wrap">
                                <span class="bg-slate-100 px-2 py-1 rounded text-slate-700">Lead Status: <b>${valOrEmpty(log.leadStatus)}</b></span>
                                <span class="bg-rose-50 text-rose-700 px-2 py-1 rounded">Close Reason: <b>${valOrEmpty(log.closeReason)}</b></span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('callLogForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const payload = {
                title: "Call Log",
                call_connected: document.getElementById('callConnectedSelect').value,
                remark: document.getElementById('callRemarkInput').value,
                followUpRequired: document.getElementById('followUpRequiredSelect').value,
                followUpOption: document.getElementById('followUpOptionInput').value,
                followUpDate: document.getElementById('followUpDateInput').value,
                followUpTime: document.getElementById('followUpTimeInput').value,
                timestamp: new Date().toLocaleString()
            };

            try {
                const response = await fetch(`/api/update-lead/${leadId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (response.ok) {
                    alert('Call response saved successfully!');
                    window.location.reload();
                } else {
                    alert(result.message || 'Failed to save call response.');
                }
            } catch (err) {
                console.error('Error submitting call response:', err);
                alert('An error occurred while saving.');
            }
        });

        loadLeadDetails();
    </script>
</body>
</html>
