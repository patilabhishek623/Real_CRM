<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lead Response - Real_Crm</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .timeline-line {
            position: absolute;
            left: 19px;
            top: 42px;
            bottom: -20px;
            width: 2px;
            background: #e2e8f0;
        }

        .timeline-last .timeline-line {
            display: none;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px 18px;
        }

        @media (max-width: 640px) {
            .detail-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>


<body class="bg-slate-50 min-h-screen text-slate-800 antialiased">


<!-- ============================================================
     HEADER
============================================================ -->

<header class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">

        <div class="flex items-center gap-3">

            <div class="w-10 h-10 bg-gradient-to-tr from-emerald-600 to-teal-500 rounded-xl flex items-center justify-center text-white shadow-lg shadow-emerald-500/20">
                <i class="fa-solid fa-calendar-days"></i>
            </div>

            <div>

                <div class="text-lg font-extrabold text-slate-900">
                    Real_<span class="text-emerald-600">Crm</span>
                </div>

                <div class="text-[9px] uppercase tracking-wider font-bold text-slate-400">
                    Lead Management
                </div>

            </div>

        </div>


        <div class="flex items-center gap-3">

            <span
                id="activeUserBadge"
                class="hidden sm:inline-flex items-center text-xs font-semibold bg-slate-100 text-slate-700 px-3 py-2 rounded-xl border border-slate-200"
            ></span>


            <a
                href="/"
                onclick="logoutUser()"
                class="inline-flex items-center gap-2 px-4 py-2 bg-rose-50 hover:bg-rose-600 text-rose-600 hover:text-white rounded-xl text-xs font-bold transition"
            >
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </a>

        </div>

    </div>

</header>



<!-- ============================================================
     PAGE
============================================================ -->

<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">


    <!-- BACK BUTTON -->

    <div class="mb-6">

        <a
            href="followups.html"
            class="inline-flex items-center gap-2 text-sm font-semibold text-slate-500 hover:text-emerald-600 transition"
        >
            <i class="fa-solid fa-arrow-left"></i>
            Back to Follow-Ups
        </a>

    </div>



    <!-- ========================================================
         LEAD HEADER
    ========================================================= -->

    <div
        id="leadHeader"
        class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 mb-6"
    >

        <div class="flex flex-col md:flex-row md:items-center justify-between gap-5">

            <div>

                <p class="text-[10px] uppercase tracking-wider font-bold text-slate-400 mb-1">
                    Lead
                </p>

                <h1
                    id="leadName"
                    class="text-2xl font-bold text-slate-900"
                >
                    Loading...
                </h1>

                <p
                    id="leadContact"
                    class="text-sm text-slate-500 mt-2"
                >
                    —
                </p>

            </div>


            <div
                id="leadStatusBadge"
                class="inline-flex items-center gap-2 px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-xs font-bold"
            >
                Loading...
            </div>

        </div>

    </div>



    <!-- ========================================================
         CUSTOMER HISTORY
    ========================================================= -->

    <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 sm:p-8">


        <!-- TITLE -->

        <div class="flex items-center gap-3 pb-6 border-b border-slate-100">

            <div class="w-11 h-11 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center">

                <i class="fa-solid fa-clock-rotate-left text-lg"></i>

            </div>


            <div>

                <h2 class="text-xl font-bold text-slate-900">
                    Customer History Timeline
                </h2>

                <p class="text-xs text-slate-400 mt-1">
                    Complete customer interaction history
                </p>

            </div>

        </div>



        <!-- TIMELINE -->

        <div
            id="customerHistoryTimeline"
            class="mt-8"
        >

            <div class="text-center py-12 text-slate-400">

                <div class="inline-block animate-spin rounded-full h-7 w-7 border-2 border-emerald-500 border-t-transparent mb-3"></div>

                <p class="text-sm font-medium">
                    Loading customer history...
                </p>

            </div>

        </div>

    </div>

</div>



<script>


/* ============================================================
   SESSION
============================================================ */

const currentUsername =
    localStorage.getItem("crm_username");


if (!currentUsername) {

    alert(
        "No active session found. Please log in again."
    );

    window.location.href = "/";

}


document.getElementById(
    "activeUserBadge"
).innerHTML = `

    <i class="fa-solid fa-user-shield text-emerald-600 mr-1"></i>

    User:

    <b class="text-slate-900 ml-1">
        ${escapeHtml(currentUsername)}
    </b>

`;



/* ============================================================
   GET LEAD ID
============================================================ */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const leadId =
    urlParams.get("id");


if (!leadId) {

    showError(
        "No lead ID was provided in the URL."
    );

}



/* ============================================================
   HTML ESCAPE
============================================================ */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



/* ============================================================
   VALUE FORMATTER
============================================================ */

function formatValue(value) {

    /*
     * Empty value
     */

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return "—";

    }


    /*
     * MongoDB Extended JSON date:
     *
     * {
     *   "$date": "2026-10-03T18:34:59.751Z"
     * }
     */

    if (
        typeof value === "object" &&
        value !== null &&
        value.$date
    ) {

        const date =
            new Date(value.$date);


        if (!isNaN(date.getTime())) {

            return date.toLocaleString();

        }


        return String(value.$date);

    }


    /*
     * Normal Date object
     */

    if (value instanceof Date) {

        return value.toLocaleString();

    }


    /*
     * Array
     */

    if (Array.isArray(value)) {

        if (!value.length) {
            return "—";
        }

        return value
            .map(item => formatValue(item))
            .join(", ");

    }


    /*
     * Other objects
     */

    if (typeof value === "object") {

        try {

            return JSON.stringify(value);

        } catch (error) {

            return String(value);

        }

    }


    return String(value);

}



/* ============================================================
   FIELD LABEL
============================================================ */

function formatFieldLabel(key) {

    if (!key) {
        return "Unknown Field";
    }


    return String(key)

        .replace(/_/g, " ")

        .replace(
            /([a-z])([A-Z])/g,
            "$1 $2"
        )

        .replace(
            /\b\w/g,
            character =>
                character.toUpperCase()
        );

}



/* ============================================================
   FORMAT LOGGED AT
============================================================ */

function formatLoggedAt(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return "—";

    }


    let rawValue = value;


    /*
     * MongoDB:
     *
     * { "$date": "..." }
     */

    if (
        typeof value === "object" &&
        value.$date
    ) {

        rawValue = value.$date;

    }


    const date =
        new Date(rawValue);


    if (isNaN(date.getTime())) {

        return formatValue(value);

    }


    return date.toLocaleString();

}



/* ============================================================
   GET ALL CALL KEYS
============================================================ */

function getCallKeys(data) {

    if (
        !data ||
        typeof data !== "object"
    ) {

        return [];

    }


    return Object.keys(data)

        .filter(key =>
            /^call\d+$/i.test(key)
        )

        .sort((a, b) => {

            const numberA =
                parseInt(
                    a.replace(/\D/g, ""),
                    10
                );


            const numberB =
                parseInt(
                    b.replace(/\D/g, ""),
                    10
                );


            return numberA - numberB;

        });

}



/* ============================================================
   FIND HISTORY SOURCE
============================================================ */

function findHistorySource(data) {

    /*
     * Case 1:
     *
     * Backend directly returns:
     *
     * {
     *   call1: {...},
     *   call2: {...}
     * }
     */

    if (
        data &&
        typeof data === "object" &&
        getCallKeys(data).length
    ) {

        return data;

    }


    /*
     * Case 2:
     *
     * Backend returns:
     *
     * {
     *   task: {
     *      call1: {...}
     *   }
     * }
     */

    if (
        data &&
        data.task &&
        typeof data.task === "object"
    ) {

        if (
            getCallKeys(data.task).length
        ) {

            return data.task;

        }

    }


    /*
     * Case 3:
     *
     * Backend returns:
     *
     * {
     *   lead: {
     *      call1: {...}
     *   }
     * }
     */

    if (
        data &&
        data.lead &&
        typeof data.lead === "object"
    ) {

        if (
            getCallKeys(data.lead).length
        ) {

            return data.lead;

        }

    }


    return {};

}



/* ============================================================
   RENDER SINGLE FIELD
============================================================ */

function renderTimelineField(
    fieldName,
    fieldValue
) {

    let displayValue;


    /*
     * Logged At gets special formatting
     */

    if (
        fieldName.toLowerCase() ===
        "loggedat"
    ) {

        displayValue =
            formatLoggedAt(fieldValue);

    } else {

        displayValue =
            formatValue(fieldValue);

    }


    return `

        <div class="border-b border-slate-100 pb-3">

            <div class="text-[10px] uppercase tracking-wider font-bold text-slate-400 mb-1">

                ${escapeHtml(
                    formatFieldLabel(fieldName)
                )}

            </div>


            <div class="text-sm font-semibold text-slate-700 break-words">

                ${escapeHtml(displayValue)}

            </div>

        </div>

    `;

}



/* ============================================================
   RENDER ONE CALL
============================================================ */

function renderCallTimelineItem(
    callKey,
    callData,
    index,
    total
) {

    const callNumber =
        callKey.replace(/\D/g, "") ||
        String(index + 1);


    /*
     * Every backend property is rendered.
     */

    const fields =
        Object.entries(callData)
            .map(([key, value]) => {

                return renderTimelineField(
                    key,
                    value
                );

            })
            .join("");


    return `

        <div
            class="relative pl-12 ${
                index === total - 1
                    ? "timeline-last"
                    : ""
            }"
        >


            <!-- Timeline line -->

            <div class="timeline-line"></div>


            <!-- Timeline icon -->

            <div class="absolute left-0 top-0 w-10 h-10 rounded-full bg-emerald-100 border-4 border-white shadow-sm flex items-center justify-center z-10">

                <i class="fa-solid fa-phone text-emerald-600"></i>

            </div>



            <!-- Call card -->

            <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden mb-8">


                <!-- Header -->

                <div class="px-5 py-4 bg-slate-50 border-b border-slate-200">

                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">


                        <div>

                            <div class="text-[10px] uppercase tracking-wider font-bold text-slate-400">
                                Customer History
                            </div>

                            <h3 class="text-lg font-bold text-slate-900 mt-0.5">
                                Call ${escapeHtml(callNumber)}
                            </h3>

                        </div>


                        <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold">

                            <i class="fa-solid fa-phone"></i>

                            Call Log

                        </div>

                    </div>

                </div>



                <!-- ALL BACKEND FIELDS -->

                <div class="p-5">

                    <div class="detail-grid">

                        ${fields}

                    </div>

                </div>

            </div>

        </div>

    `;

}



/* ============================================================
   RENDER CUSTOMER HISTORY
============================================================ */

function renderCustomerHistoryTimeline(
    backendData
) {

    const container =
        document.getElementById(
            "customerHistoryTimeline"
        );


    if (!container) {
        return;
    }


    const historyData =
        findHistorySource(
            backendData
        );


    const callKeys =
        getCallKeys(historyData);


    /*
     * No calls
     */

    if (!callKeys.length) {

        container.innerHTML = `

            <div class="text-center py-16">

                <div class="w-14 h-14 mx-auto rounded-2xl bg-slate-50 border border-slate-100 flex items-center justify-center text-slate-300 mb-4">

                    <i class="fa-solid fa-clock-rotate-left text-xl"></i>

                </div>

                <p class="text-sm font-bold text-slate-700">
                    No Customer History
                </p>

                <p class="text-xs text-slate-400 mt-1">
                    No call logs were found for this lead.
                </p>

            </div>

        `;

        return;

    }


    /*
     * Render all calls:
     *
     * call1
     * call2
     * call3
     * ...
     */

    container.innerHTML =
        callKeys
            .map((callKey, index) => {

                const callData =
                    historyData[callKey];


                if (
                    !callData ||
                    typeof callData !== "object"
                ) {

                    return "";

                }


                return renderCallTimelineItem(
                    callKey,
                    callData,
                    index,
                    callKeys.length
                );

            })
            .join("");

}



/* ============================================================
   UPDATE LEAD HEADER
============================================================ */

function updateLeadHeader(
    backendData
) {

    let lead =
        backendData;


    if (
        backendData &&
        backendData.lead
    ) {

        lead =
            backendData.lead;

    }


    if (
        backendData &&
        backendData.task
    ) {

        lead =
            backendData.task;

    }


    if (
        !lead ||
        typeof lead !== "object"
    ) {

        return;

    }


    /*
     * Name
     */

    const name =
        lead.name ||
        lead.customerName ||
        lead.leadName ||
        "Lead";


    document.getElementById(
        "leadName"
    ).textContent =
        formatValue(name);


    /*
     * Contact
     */

    const contact =
        lead.contactNumber ||
        lead.phone ||
        lead.mobile ||
        "";


    document.getElementById(
        "leadContact"
    ).innerHTML =
        contact
        ?
        `
            <a
                href="tel:${encodeURIComponent(contact)}"
                class="inline-flex items-center gap-2 hover:text-emerald-600"
            >

                <i class="fa-solid fa-phone text-xs"></i>

                ${escapeHtml(contact)}

            </a>
        `
        :
        "Contact Number: —";


    /*
     * Status
     */

    const status =
        lead.leadStatus ||
        lead.status ||
        "—";


    const statusBadge =
        document.getElementById(
            "leadStatusBadge"
        );


    statusBadge.textContent =
        status;


    if (
        String(status)
            .toLowerCase() === "completed"
    ) {

        statusBadge.className =
            "inline-flex items-center gap-2 px-4 py-2 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-xl text-xs font-bold";

    }

}



/* ============================================================
   FIND LEAD RESPONSE
============================================================ */

async function loadLeadData() {

    try {

        /*
         * First try the lead-response endpoint.
         */

        let response =
            await fetch(
                `/api/lead-response/${encodeURIComponent(leadId)}`,
                {
                    method: "GET",
                    headers: {
                        "Accept": "application/json"
                    },
                    cache: "no-store"
                }
            );


        /*
         * If that endpoint doesn't exist,
         * fall back to member tasks.
         */

        if (!response.ok) {

            response =
                await fetch(
                    `/api/member-tasks/${encodeURIComponent(currentUsername)}`,
                    {
                        method: "GET",
                        headers: {
                            "Accept": "application/json"
                        },
                        cache: "no-store"
                    }
                );

        }


        if (!response.ok) {

            throw new Error(
                `Server returned ${response.status}`
            );

        }


        const data =
            await response.json();


        /*
         * If using member-tasks endpoint,
         * find the requested lead.
         */

        let finalData =
            data;


        if (
            data &&
            Array.isArray(data.tasks)
        ) {

            const task =
                data.tasks.find(item => {

                    const itemId =
                        item._id ||
                        item.id;

                    return String(itemId) ===
                        String(leadId);

                });


            if (!task) {

                throw new Error(
                    "Lead was not found in the assigned tasks."
                );

            }


            finalData =
                task;

        }


        /*
         * Update header
         */

        updateLeadHeader(
            finalData
        );


        /*
         * Render ALL call logs
         */

        renderCustomerHistoryTimeline(
            finalData
        );


    } catch (error) {

        console.error(
            "Failed to load lead:",
            error
        );


        document.getElementById(
            "customerHistoryTimeline"
        ).innerHTML = `

            <div class="text-center py-14">

                <div class="w-14 h-14 mx-auto rounded-2xl bg-rose-50 border border-rose-100 flex items-center justify-center text-rose-500 mb-4">

                    <i class="fa-solid fa-circle-exclamation text-xl"></i>

                </div>

                <p class="text-sm font-bold text-slate-700">
                    Failed to load customer history
                </p>

                <p class="text-xs text-slate-400 mt-1">
                    ${escapeHtml(error.message)}
                </p>

                <button
                    onclick="loadLeadData()"
                    class="mt-4 px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold"
                >
                    <i class="fa-solid fa-rotate-right mr-1"></i>
                    Try Again
                </button>

            </div>

        `;

    }

}



/* ============================================================
   ERROR
============================================================ */

function showError(message) {

    document.getElementById(
        "customerHistoryTimeline"
    ).innerHTML = `

        <div class="text-center py-14 text-rose-500">

            <i class="fa-solid fa-circle-exclamation text-2xl mb-3"></i>

            <p class="text-sm font-semibold">
                ${escapeHtml(message)}
            </p>

        </div>

    `;

}



/* ============================================================
   LOGOUT
============================================================ */

function logoutUser() {

    localStorage.clear();

}



/* ============================================================
   START
============================================================ */

if (leadId) {

    loadLeadData();

}

</script>

</body>
</html>
