<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Customer History Timeline - Real_Crm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .corporate-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 12px -2px rgba(15, 23, 42, 0.05), 0 2px 6px -1px rgba(15, 23, 42, 0.03);
            transition: all 0.2s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-50/90 min-h-screen text-slate-800 flex flex-col antialiased selection:bg-emerald-500 selection:text-white pb-24 md:pb-8">

    <header class="bg-white/95 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-30 transition-all">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 sm:h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 sm:w-11 sm:h-11 bg-gradient-to-tr from-emerald-600 to-teal-500 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-clock-rotate-left text-base sm:text-lg"></i>
                </div>
                <div>
                    <span class="text-lg sm:text-xl font-extrabold tracking-tight text-slate-900">Real_<span class="text-emerald-600">Crm</span></span>
                    <span class="block text-[9px] sm:text-[10px] uppercase tracking-wider font-bold text-slate-400">Customer History</span>
                </div>
            </div>
            <div class="flex items-center gap-2 sm:gap-4">
                <span id="activeUserBadge" class="hidden sm:inline-flex items-center text-xs font-semibold bg-slate-100 text-slate-700 px-3.5 py-2 rounded-xl border border-slate-200/60 shadow-2xs"></span>
                <a href="/" onclick="localStorage.clear()" class="group inline-flex items-center gap-1.5 px-3.5 py-2 bg-rose-50 hover:bg-rose-600 text-rose-600 hover:text-white font-semibold text-xs sm:text-sm rounded-xl transition-all duration-200 shadow-2xs">
                    <i class="fa-solid fa-right-from-bracket transition-transform group-hover:-translate-x-0.5"></i>
                    <span class="hidden sm:inline">Logout</span>
                </a>
            </div>
        </div>
    </header>

    <div class="max-w-4xl mx-auto px-3 sm:px-6 lg:px-8 py-6 w-full flex-grow space-y-6">
        
        <!-- Page Title & Overview -->
        <div class="bg-white rounded-2xl border border-slate-200/80 p-5 sm:p-6 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h1 class="text-xl font-bold text-slate-900">Interaction History</h1>
                <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Complete chronological breakdown of recorded call logs and follow-up activities.</p>
            </div>
            <a href="teammember.html" class="inline-flex items-center gap-2 px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition">
                <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>

        <!-- Dynamic Timeline Feed Container -->
        <div id="timelineContainer" class="space-y-4">
            <div class="text-center py-12 text-slate-400">
                <div class="inline-block animate-spin rounded-full h-6 w-6 border-2 border-emerald-500 border-t-transparent mb-2"></div>
                <p class="text-xs font-medium">Loading history timeline...</p>
            </div>
        </div>
    </div>

    <!-- Mobile Sticky Bottom Navigation Bar -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 px-4 py-2.5 z-50 flex items-center justify-around shadow-lg">
        <a href="teammember.html" class="flex flex-col items-center text-slate-500 hover:text-slate-900 font-medium text-[10px] gap-1">
            <i class="fa-solid fa-house text-base"></i>
            <span>Dashboard</span>
        </a>
        <a href="assignedmembertask.html" class="flex flex-col items-center text-slate-500 hover:text-slate-900 font-medium text-[10px] gap-1 relative">
            <i class="fa-solid fa-list-check text-base"></i>
            <span>Tasks</span>
        </a>
        <a href="followups.html" class="flex flex-col items-center text-slate-500 hover:text-slate-900 font-medium text-[10px] gap-1">
            <i class="fa-solid fa-calendar-days text-base"></i>
            <span>Follow-ups</span>
        </a>
        <a href="visits.html" class="flex flex-col items-center text-slate-500 hover:text-slate-900 font-medium text-[10px] gap-1">
            <i class="fa-solid fa-map-location-dot text-base"></i>
            <span>Visits</span>
        </a>
    </nav>

    <script>
        const currentUsername = localStorage.getItem('crm_username');
        if (!currentUsername) {
            alert('No active session found. Please log in again.');
            window.location.href = '/';
        }
        document.getElementById('activeUserBadge').innerHTML = `<i class="fa-solid fa-user-shield text-emerald-600 mr-1.5"></i> User: <b class="text-slate-900 ml-1">${currentUsername}</b>`;

        // Function to load and render all call records dynamically (call1, call2, call3, etc.)
        async function loadCustomerHistory() {
            const urlParams = new URLSearchParams(window.location.search);
            const leadId = urlParams.get('id');

            const container = document.getElementById('timelineContainer');

            if (!leadId) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-8 text-center border border-slate-200 text-slate-400">
                        <i class="fa-solid fa-triangle-exclamation text-2xl mb-2 text-amber-500"></i>
                        <p class="text-sm font-semibold text-slate-700">No Lead ID Specified</p>
                        <p class="text-xs text-slate-400 mt-1">Please select a valid lead from your dashboard or task list.</p>
                    </div>`;
                return;
            }

            try {
                // Fetch lead/task details containing the call logs
                const res = await fetch(`/api/task/${leadId}`);
                const data = await res.json();

                if (data.success && data.task) {
                    const task = data.task;
                    
                    // Filter keys that match 'call' followed by numbers (call1, call2, call3...)
                    const callKeys = Object.keys(task).filter(key => /^call\d+$/i.test(key));

                    if (callKeys.length === 0) {
                        container.innerHTML = `
                            <div class="bg-white rounded-2xl p-8 text-center border border-slate-200 text-slate-400">
                                <i class="fa-solid fa-comment-slash text-2xl mb-2 text-slate-300"></i>
                                <p class="text-sm font-semibold text-slate-700">No Call Logs Found</p>
                                <p class="text-xs text-slate-400 mt-1">There are no interaction logs recorded for this lead yet.</p>
                            </div>`;
                        return;
                    }

                    // Sort call keys numerically (call1, call2, call3...)
                    callKeys.sort((a, b) => {
                        const numA = parseInt(a.replace(/\D/g, '')) || 0;
                        const numB = parseInt(b.replace(/\D/g, '')) || 0;
                        return numA - numB;
                    });

                    // Render each call record attractively
                    container.innerHTML = callKeys.map(key => {
                        const call = task[key];
                        if (!call || typeof call !== 'object') return '';

                        const isConnected = call.call_connected && call.call_connected.toLowerCase().includes('connect');
                        const connectionBadgeClass = isConnected 
                            ? 'bg-emerald-50 text-emerald-700 border-emerald-200' 
                            : 'bg-rose-50 text-rose-700 border-rose-200';
                        const connectionIcon = isConnected ? 'fa-phone' : 'fa-phone-slash';

                        return `
                            <div class="corporate-card rounded-2xl p-4 sm:p-6 space-y-4">
                                <!-- Card Header -->
                                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 pb-3.5 border-b border-slate-100">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center font-bold text-sm border border-emerald-100 shadow-2xs flex-shrink-0">
                                            <i class="fa-solid fa-phone-volume"></i>
                                        </div>
                                        <div>
                                            <h4 class="font-bold text-slate-900 text-sm">${call.title || 'Call Log'}</h4>
                                            <p class="text-[11px] text-slate-500 font-medium">Interaction Record #${key}</p>
                                        </div>
                                    </div>
                                    <span class="px-3 py-1 font-bold rounded-lg text-[10px] uppercase border flex items-center gap-1.5 shadow-2xs ${connectionBadgeClass}">
                                        <i class="fa-solid ${connectionIcon} text-[9px]"></i> ${call.call_connected || 'N/A'}
                                    </span>
                                </div>

                                <!-- Data Fields Grid -->
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                                    
                                    <!-- Remark -->
                                    <div class="bg-slate-50/80 p-3 rounded-xl border border-slate-200/60 space-y-1">
                                        <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">Call Remark</span>
                                        <p class="text-slate-700 font-medium">${call.remark || '<span class="text-slate-400 italic">No remarks provided</span>'}</p>
                                    </div>

                                    <!-- Follow-Up Option -->
                                    <div class="bg-slate-50/80 p-3 rounded-xl border border-slate-200/60 space-y-1">
                                        <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">Follow-Up Option</span>
                                        ${call.followUpOption ? `
                                            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 bg-amber-50 text-amber-700 font-bold rounded-lg text-[11px] border border-amber-200 shadow-2xs">
                                                <i class="fa-solid fa-tag text-[9px] text-amber-500"></i> ${call.followUpOption}
                                            </span>` : '<p class="text-slate-400 italic font-medium">N/A</p>'}
                                    </div>

                                    <!-- Follow-Up Date & Time -->
                                    <div class="bg-slate-50/80 p-3 rounded-xl border border-slate-200/60 space-y-1">
                                        <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">Scheduled Follow-Up Date & Time</span>
                                        <div class="flex items-center gap-2 font-semibold text-slate-700 flex-wrap">
                                            <span class="bg-white px-2 py-1 rounded-md border border-slate-200 shadow-2xs"><i class="fa-regular fa-calendar text-slate-400 mr-1"></i> ${call.followUpDate || 'Not Set'}</span>
                                            <span class="bg-white px-2 py-1 rounded-md border border-slate-200 shadow-2xs"><i class="fa-regular fa-clock text-slate-400 mr-1"></i> ${call.followUpTime || 'N/A'}</span>
                                        </div>
                                    </div>

                                    <!-- Follow-Up Required Status -->
                                    <div class="bg-slate-50/80 p-3 rounded-xl border border-slate-200/60 space-y-1">
                                        <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">Follow-Up Required</span>
                                        <span class="inline-flex items-center gap-1 px-2.5 py-1 bg-emerald-50 text-emerald-700 font-bold rounded-lg text-[11px] border border-emerald-200 shadow-2xs">
                                            <i class="fa-solid fa-check text-[9px]"></i> ${call.followUpRequired || 'No'}
                                        </span>
                                    </div>

                                    <!-- Site Visit Scheduled Status -->
                                    <div class="bg-slate-50/80 p-3 rounded-xl border border-slate-200/60 space-y-1">
                                        <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">Site Visit Scheduled</span>
                                        <span class="inline-flex items-center gap-1 px-2.5 py-0.5 bg-slate-200/60 text-slate-700 font-bold rounded-md text-[11px] border border-slate-300">
                                            ${call.visitScheduled || 'No'}
                                        </span>
                                    </div>

                                    <!-- Additional Metadata (Visit Details / Lead Status if filled) -->
                                    <div class="bg-slate-50/80 p-3 rounded-xl border border-slate-200/60 space-y-1">
                                        <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">Lead Status / Close Reason</span>
                                        <p class="text-slate-700 font-medium">${call.leadStatus || call.closeReason || '<span class="text-slate-400 italic">Open / Ongoing</span>'}</p>
                                    </div>

                                </div>
                            </div>
                        `;
                    }).join('');

                } else {
                    container.innerHTML = `
                        <div class="bg-white rounded-2xl p-8 text-center border border-slate-200 text-rose-500">
                            <i class="fa-solid fa-circle-exclamation text-xl mb-1"></i>
                            <p class="text-xs font-medium">Failed to retrieve history logs for this lead.</p>
                        </div>`;
                }
            } catch (err) {
                console.error('Error fetching history timeline:', err);
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-8 text-center border border-slate-200 text-rose-500">
                        <i class="fa-solid fa-circle-exclamation text-xl mb-1"></i>
                        <p class="text-xs font-medium">An error occurred while loading history records.</p>
                    </div>`;
            }
        }

        loadCustomerHistory();
    </script>
</body>
</html>
