<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lead Response & Call Action - Real_Crm</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Inter Font & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .corporate-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 12px -2px rgba(15, 23, 42, 0.05), 0 2px 6px -1px rgba(15, 23, 42, 0.03);
        }
    </style>
</head>
<body class="min-h-full text-slate-800 flex flex-col selection:bg-blue-600 selection:text-white relative pb-28 md:pb-8">

    <!-- Ambient Background Accents -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl"></div>
        <div class="absolute top-1/3 -right-40 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl"></div>
    </div>

    <!-- Top Corporate Navigation Bar -->
    <header class="bg-white/95 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-50 shadow-xs">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 sm:h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="followups.html" class="w-10 h-10 sm:w-11 sm:h-11 bg-slate-100 hover:bg-slate-200 rounded-2xl flex items-center justify-center text-slate-700 transition border border-slate-200 flex-shrink-0">
                    <i class="fa-solid fa-arrow-left text-sm"></i>
                </a>
                <div>
                    <div class="flex items-center gap-1.5 sm:gap-2">
                        <span class="text-base sm:text-xl font-black tracking-tight text-slate-900">Real_Crm Hub</span>
                        <span class="text-[9px] sm:text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 bg-blue-50 text-blue-700 rounded-md border border-blue-200">Call Action</span>
                    </div>
                    <span id="activeUserBadge" class="text-[10px] sm:text-xs text-slate-500 font-medium">Loading session...</span>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <a href="followups.html" class="inline-flex items-center gap-1.5 px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition border border-slate-200">
                    <i class="fa-solid fa-xmark"></i>
                    <span class="hidden sm:inline">Back to Follow-Ups</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Workspace Layout -->
    <div class="max-w-5xl mx-auto px-3 sm:px-6 lg:px-8 py-6 w-full flex-grow space-y-6 relative z-10">
        
        <!-- Lead Overview Card -->
        <div class="corporate-card rounded-2xl p-5 sm:p-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div class="space-y-1">
                <span class="text-[10px] uppercase font-bold tracking-wider text-slate-400">Lead Name & Contact</span>
                <h1 id="leadNameDisplay" class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">Loading Lead...</h1>
                <a id="leadPhoneLink" href="#" class="text-xs sm:text-sm font-bold text-blue-600 hover:underline inline-flex items-center gap-1.5">
                    <i class="fa-solid fa-phone text-xs"></i> <span id="leadPhoneDisplay">Loading...</span>
                </a>
            </div>
            <div class="flex flex-wrap gap-2">
                <div class="bg-slate-50 px-3 py-2 rounded-xl border border-slate-200 text-xs">
                    <span class="text-[9px] uppercase font-bold tracking-wider text-slate-400 block">Lead Source</span>
                    <span id="leadSourceDisplay" class="font-bold text-slate-800">-</span>
                </div>
                <div class="bg-blue-50 px-3 py-2 rounded-xl border border-blue-200 text-xs">
                    <span class="text-[9px] uppercase font-bold tracking-wider text-blue-400 block">Account Status</span>
                    <span id="accountStatusDisplay" class="font-bold text-blue-700">Active Pipeline</span>
                </div>
            </div>
        </div>

        <!-- Call Input Wizard Container -->
        <div class="corporate-card rounded-2xl p-5 sm:p-8 space-y-6">
            <div class="border-b border-slate-200 pb-4">
                <h2 class="text-base sm:text-lg font-bold text-slate-900"><i class="fa-solid fa-headset text-blue-600 mr-2"></i> Call Input Wizard</h2>
                <p class="text-xs text-slate-500 mt-0.5">Log live call outcomes, customer responses, and schedule future follow-up actions.</p>
            </div>

            <!-- Response Form -->
            <form id="callActionForm" onsubmit="submitCallAction(event)" class="space-y-5">
                <input type="hidden" id="hiddenTaskId">
                <input type="hidden" id="hiddenLeadId">

                <!-- 1. Connection Status -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700">1. Was the call connected?</label>
                    <select id="callConnectedSelect" onchange="toggleConnectionState()" required class="w-full px-3.5 py-3 bg-slate-50 border border-slate-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 font-semibold text-slate-800 transition">
                        <option value="" disabled selected>Select connection status...</option>
                        <option value="yes">Yes, Connected</option>
                        <option value="no">No, Not Connected</option>
                    </select>
                </div>

                <!-- Conditional Container for Connected / Not Connected Fields -->
                <div id="wizardDetailsContainer" class="hidden space-y-4 pt-2">
                    <!-- Dynamic fields can be rendered here based on call status -->
                    <div class="space-y-1.5">
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700">Call Remark / Notes</label>
                        <textarea id="callRemarkInput" rows="3" placeholder="Enter detailed conversation notes or closure reasons..." class="w-full px-3.5 py-3 bg-slate-50 border border-slate-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition"></textarea>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="space-y-1.5">
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-700">Next Follow-Up Date</label>
                            <input type="date" id="nextFollowUpDate" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition">
                        </div>
                        <div class="space-y-1.5">
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-700">Next Follow-Up Time</label>
                            <input type="time" id="nextFollowUpTime" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition">
                        </div>
                    </div>
                </div>

                <div class="pt-4 flex items-center justify-end gap-3">
                    <a href="followups.html" class="px-5 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs transition">Cancel</a>
                    <button type="submit" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs transition shadow-md shadow-blue-600/20">
                        <i class="fa-solid fa-check mr-1.5"></i> Save Call Log
                    </button>
                </div>
            </form>
        </div>

    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- JavaScript Controller -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('username') || localStorage.getItem('crm_username');
        const leadId = urlParams.get('leadId');
        const taskId = urlParams.get('taskId');

        if (!username) {
            window.location.href = '/';
        } else {
            document.getElementById('activeUserBadge').textContent = `User: ${username}`;
        }

        document.getElementById('hiddenTaskId').value = taskId || '';
        document.getElementById('hiddenLeadId').value = leadId || '';

        // Fetch individual unique lead details using leadId or taskId
        async function loadLeadDetails() {
            try {
                const response = await fetch(`/api/lead-details/${encodeURIComponent(username)}/${encodeURIComponent(taskId || leadId)}`);
                const data = await response.json();

                if (data.success && (data.lead || data.task)) {
                    const lead = data.lead || data.task;

                    document.getElementById('leadNameDisplay').textContent = lead.name || 'Unnamed Lead';
                    document.getElementById('leadPhoneDisplay').textContent = lead.contactNumber || 'N/A';
                    document.getElementById('leadPhoneLink').href = `tel:${lead.contactNumber || ''}`;
                    document.getElementById('leadSourceDisplay').textContent = lead.leadSource || 'Excel lead sheet';
                    document.getElementById('accountStatusDisplay').textContent = lead.status || 'Active Pipeline';
                } else {
                    showToast('Could not load specific lead details. Displaying generic view.', 'error');
                }
            } catch (err) {
                console.error('Error fetching lead details:', err);
                showToast('Failed to connect to backend record.', 'error');
            }
        }

        function toggleConnectionState() {
            const container = document.getElementById('wizardDetailsContainer');
            const val = document.getElementById('callConnectedSelect').value;
            if (val) {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
        }

        async function submitCallAction(e) {
            e.preventDefault();
            const connectedStatus = document.getElementById('callConnectedSelect').value;
            const remark = document.getElementById('callRemarkInput').value;
            const followUpDate = document.getElementById('nextFollowUpDate').value;
            const followUpTime = document.getElementById('nextFollowUpTime').value;

            try {
                const res = await fetch(`/api/update-lead-call/${encodeURIComponent(username)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ taskId, leadId, connectedStatus, remark, followUpDate, followUpTime })
                });
                const result = await res.json();

                if (result.success) {
                    showToast('Call log saved successfully!', 'success');
                    setTimeout(() => { window.location.href = 'followups.html'; }, 1000);
                } else {
                    showToast(result.message || 'Failed to save call action.', 'error');
                }
            } catch (err) {
                console.error('Error saving call action:', err);
                showToast('Network error while saving.', 'error');
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg text-xs font-semibold transform translate-y-4 opacity-0 transition-all duration-300 ${
                type === 'success' ? 'bg-slate-900 border border-emerald-500/40 text-emerald-400' : 'bg-slate-900 border border-rose-500/40 text-rose-400'
            }`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-triangle-exclamation'} text-sm"></i> <span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => toast.classList.remove('translate-y-4', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-4', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        if (taskId || leadId) {
            loadLeadDetails();
        }
    </script>
</body>
</html>
