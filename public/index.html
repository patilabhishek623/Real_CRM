<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Real_Crm | Real Estate Property Management</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="h-full bg-slate-950 bg-[radial-gradient(ellipse_80%_80%_at_50%_-20%,rgba(30,58,138,0.4),rgba(255,255,255,0))] flex items-center justify-center p-4 sm:p-6">

    <!-- Decorative background ambient glow -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -right-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
    </div>

    <!-- Main Container Card -->
    <div class="relative w-full max-w-md bg-slate-900/80 backdrop-blur-2xl border border-slate-800/80 rounded-3xl shadow-2xl shadow-blue-950/50 overflow-hidden p-6 sm:p-8 text-white">
        
        <!-- Real Estate Branding Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-2xl shadow-xl shadow-blue-600/30 mb-4 transform hover:scale-105 transition duration-300 border border-blue-400/30">
                <i class="fa-solid fa-building-user text-2xl text-white"></i>
            </div>
            <div class="inline-block px-3 py-1 mb-2 bg-blue-500/10 border border-blue-500/20 rounded-full text-[11px] font-bold uppercase tracking-widest text-blue-400">
                Property & Lead CRM
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">Real_Crm</h1>
            <p class="text-slate-400 text-xs sm:text-sm mt-1">Access site visits, follow-ups & team pipelines</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-4 sm:space-y-5">
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-300 mb-2">Username / Agent ID</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 text-sm">
                        <i class="fa-solid fa-user-tie"></i>
                    </span>
                    <input type="text" id="username" required placeholder="Enter username (e.g. lead)" 
                        class="w-full pl-11 pr-4 py-3 sm:py-3.5 bg-slate-950/60 border border-slate-800 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-white placeholder-slate-600 text-sm transition">
                </div>
            </div>

            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-300 mb-2">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 text-sm">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" required placeholder="••••••••" 
                        class="w-full pl-11 pr-4 py-3 sm:py-3.5 bg-slate-950/60 border border-slate-800 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-white placeholder-slate-600 text-sm transition">
                </div>
            </div>

            <button type="submit" 
                class="w-full py-3.5 sm:py-4 bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-700 hover:from-blue-500 hover:to-indigo-500 text-white font-bold text-sm rounded-2xl shadow-lg shadow-blue-600/30 transition-all duration-200 transform active:scale-95 flex items-center justify-center gap-2.5 cursor-pointer">
                <span>Sign In to Workspace</span>
                <i class="fa-solid fa-arrow-right-to-bracket text-xs"></i>
            </button>
        </form>

        <!-- Error Notification Area -->
        <div id="error" class="mt-4 text-center text-xs sm:text-sm font-semibold text-rose-400 min-h-[20px]"></div>

        <!-- Footer Help info -->
        <div class="mt-8 text-center border-t border-slate-800/80 pt-4 text-xs text-slate-500">
            Need property portal credentials? Contact your <span class="text-slate-400 font-medium">Team Lead</span>.
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = '';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('crm_username', data.username);
                    localStorage.setItem('crm_role', data.role);

                    if (data.role === 'teamlead') {
                        window.location.href = 'teamlead.html';
                    } else if (data.role === 'teammember') {
                        window.location.href = 'teammember.html';
                    }
                } else {
                    errorDiv.textContent = data.message || 'Invalid username or password.';
                }
            } catch (err) {
                errorDiv.textContent = 'Unable to connect to server backend.';
            }
        });
    </script>
</body>
</html>
