<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Profile & Interaction Log - Real_Crm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .fade-in { animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #f8fafc; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-100 via-blue-50/30 to-slate-200 min-h-screen text-slate-800 flex items-center justify-center p-3 sm:p-6 relative">

    <!-- Top Right Executive Back Button (Optimized for Mobile Touch) -->
    <a href="followups.html" class="absolute top-4 right-4 sm:top-6 sm:right-6 bg-white/95 backdrop-blur-md hover:bg-white text-slate-700 hover:text-blue-600 border border-slate-200/80 px-3 py-2 sm:px-4 sm:py-2.5 rounded-xl shadow-sm hover:shadow-md transition text-xs font-bold flex items-center space-x-1.5 group z-10">
        <i class="fa-solid fa-arrow-left text-[10px] transition-transform group-hover:-translate-x-0.5"></i>
        <span class="hidden xs:inline">Return to Follow-Ups</span>
        <span class="xs:hidden">Back</span>
    </a>

    <!-- UNIFIED MASTER CONTAINER WITH COMMON BORDER -->
    <div class="max-w-6xl w-full bg-white rounded-2xl sm:rounded-3xl border border-slate-200/95 shadow-2xl shadow-slate-200/70 p-4 sm:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 items-start mt-14 sm:mt-0">
        
        <!-- ================= LEFT SIDE PANEL: BRANDING & SUMMARY ================= -->
        <div class="lg:col-span-4 bg-gradient-to-br from-slate-900 via-blue-950 to-indigo-950 text-white rounded-2xl p-5 sm:p-6 shadow-xl space-y-5 relative overflow-hidden border border-slate-800">
            <div class="absolute -right-12 -top-12 w-44 h-44 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -left-12 -bottom-12 w-44 h-44 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <div class="relative z-10 flex items-center space-x-4 lg:block lg:space-x-0 lg:space-y-4">
                <div class="w-12 h-12 sm:w-14 sm:h-14 bg-white/10 text-blue-400 rounded-2xl flex items-center justify-center border border-white/10 shadow-inner backdrop-blur-md flex-shrink-0">
                    <i class="fa-solid fa-building-user text-lg sm:text-xl"></i>
                </div>
                <div class="min-w-0 flex-1">
                    <span class="px-2.5 py-0.5 rounded-md text-[9px] sm:text-[10px] font-extrabold tracking-wider uppercase bg-blue-500/20 text-blue-300 border border-blue-400/30">Real_Crm Hub</span>
                    <h2 class="text-lg sm:text-xl font-extrabold tracking-tight text-white mt-1.5 truncate" id="panelLeadName">Loading...</h2>
                    <p class="text-xs font-medium text-blue-200/80 mt-0.5 flex items-center truncate">
                        <i class="fa-solid fa-phone mr-1.5 text-[10px] flex-shrink-0"></i> <span id="panelLeadContact" class="truncate">Loading...</span>
                    </p>
                </div>
            </div>

            <!-- Call Now Interactive Button -->
            <div class="relative z-10">
                <a id="callNowBtn" href="#" onclick="triggerDirectCall(event)" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-3 px-4 rounded-xl shadow-lg shadow-emerald-900/40 transition text-xs flex items-center justify-center space-x-2 border border-emerald-400/30">
                    <i class="fa-solid fa-phone-volume animate-bounce"></i>
                    <span>Call Now</span>
                </a>
            </div>

            <div class="relative z-10 pt-4 border-t border-white/10 space-y-3">
                <div class="bg-white/5 backdrop-blur-md p-3.5 rounded-xl border border-white/10 space-y-1">
                    <span class="text-[10px] font-bold text-blue-300 uppercase tracking-wider block">Lead Source / Property</span>
                    <p class="text-xs text-slate-200 font-medium leading-relaxed" id="leadDescription">Loading lead requirements...</p>
                </div>

                <div class="bg-white/5 backdrop-blur-md p-3.5 rounded-xl border border-white/10 flex items-center justify-between">
                    <div>
                        <span class="text-[10px] font-bold text-blue-300 uppercase tracking-wider block">Account Status</span>
                        <span class="text-xs text-emerald-400 font-bold flex items-center mt-0.5">
                            <span class="w-2 h-2 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span> Active Pipeline
                        </span>
                    </div>
                    <div class="w-9 h-9 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 flex-shrink-0">
                        <i class="fa-solid fa-shield-check text-sm"></i>
                    </div>
                </div>
            </div>

            <div class="relative z-10 pt-1 text-center">
                <p class="text-[10px] font-medium text-slate-400">Real Estate CRM &copy; 2026</p>
            </div>
        </div>

        <!-- ================= RIGHT SIDE PANEL: WIZARD & HISTORY ================= -->
        <div class="lg:col-span-8 space-y-5">
            
            <!-- Navigation Tabs -->
            <div class="grid grid-cols-2 gap-1.5 bg-slate-100 p-1.5 rounded-xl border border-slate-200/80">
                <button onclick="switchTab('input')" id="tabCallInput" class="py-2.5 px-3 rounded-lg text-xs font-bold transition bg-blue-600 text-white shadow-sm flex items-center justify-center space-x-1.5 truncate">
                    <i class="fa-solid fa-phone-volume text-[11px]"></i>
                    <span class="truncate">Call Wizard</span>
                </button>
                <button onclick="switchTab('history')" id="tabCustomerHistory" class="py-2.5 px-3 rounded-lg text-xs font-bold transition text-slate-600 hover:text-slate-900 flex items-center justify-center space-x-1.5 truncate">
                    <i class="fa-solid fa-timeline text-[11px]"></i>
                    <span class="truncate">History Timeline</span>
                </button>
            </div>

            <!-- ================= TAB 1: CALL INPUT WIZARD ================= -->
            <div id="sectionCallInput" class="space-y-4 fade-in">
                <!-- Step 1: Was the call connected? -->
                <div class="p-3.5 sm:p-4 bg-slate-50/80 rounded-2xl border border-slate-200 space-y-2">
                    <label class="block text-[11px] font-extrabold text-blue-900 uppercase tracking-wider">1. Was the call connected?</label>
                    <select id="callConnected" onchange="onConnectionChange()" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-3 text-sm font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition shadow-sm">
                        <option value="" disabled selected>Select connection status...</option>
                        <option value="Yes">Yes, Connected</option>
                        <option value="No">No, Not Connected</option>
                    </select>
                </div>

                <!-- CONNECTED FLOW -->
                <div id="stepConnectedSub" class="p-3.5 sm:p-4 bg-slate-50/80 rounded-2xl border border-slate-200 space-y-2 hidden fade-in">
                    <label class="block text-[11px] font-extrabold text-blue-900 uppercase tracking-wider">2. Select Specific Remark / Detail</label>
                    <select id="tempSubOption" onchange="showConnectedCloseLead()" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-3 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition shadow-sm">
                        <option value="" disabled selected>Choose specific requirement...</option>
                        <option value="Interested – Wants Project Details">Interested – Wants Project Details</option>
                        <option value="Interested – Wants Price Details">Interested – Wants Price Details</option>
                        <option value="Interested – Wants Brochure">Interested – Wants Brochure</option>
                        <option value="Interested – Wants Floor Plan">Interested – Wants Floor Plan</option>
                        <option value="Interested – Wants Payment Plan">Interested – Wants Payment Plan</option>
                        <option value="Interested – Wants Location Details">Interested – Wants Location Details</option>
                        <option value="Interested – Wants Amenities Details">Interested – Wants Amenities Details</option>
                        <option value="Interested – Wants Configuration Options">Interested – Wants Configuration Options</option>
                        <option value="Interested – Comparing Multiple Projects">Interested – Comparing Multiple Projects</option>
                        <option value="Interested – Wants to Discuss With Family">Interested – Wants to Discuss With Family</option>
                        <option value="Interested – Wants to Speak With Spouse">Interested – Wants to Speak With Spouse</option>
                        <option value="Interested – Wants Developer/Builder Details">Interested – Wants Developer/Builder Details</option>
                    </select>
                </div>

                <div id="stepConnectedCloseLead" class="p-3.5 sm:p-4 bg-slate-50/80 rounded-2xl border border-slate-200 space-y-3 hidden fade-in">
                    <label class="block text-[11px] font-extrabold text-blue-900 uppercase tracking-wider">Close Lead (Unsuccessful Lead)?</label>
                    <select id="connectedCloseLeadOption" onchange="onConnectedCloseLeadChange()" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-3 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition shadow-sm">
                        <option value="" disabled selected>Select option...</option>
                        <option value="Yes">Yes, Close Lead</option>
                        <option value="No">No, Keep Active</option>
                    </select>
                    <div id="connectedCloseReasonSection" class="space-y-1 hidden pt-1">
                        <label class="block text-[10px] font-extrabold text-rose-600 uppercase tracking-wider mb-1">Reason for Closing Lead</label>
                        <input type="text" id="connectedCloseLeadReason" placeholder="Enter reason..." class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-3 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-rose-500 shadow-sm">
                    </div>
                </div>

                <div id="stepConnectedTemp" class="p-3.5 sm:p-4 bg-slate-50/80 rounded-2xl border border-slate-200 space-y-2 hidden fade-in">
                    <label class="block text-[11px] font-extrabold text-blue-900 uppercase tracking-wider">3. Lead Temperature</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" onclick="selectTemperature('HOT', this)" class="temp-btn py-3 px-2 rounded-xl border border-slate-300 text-xs font-bold text-slate-700 bg-white hover:bg-rose-50 hover:border-rose-300 hover:text-rose-600 transition shadow-sm truncate">🔥 Hot</button>
                        <button type="button" onclick="selectTemperature('WARM', this)" class="temp-btn py-3 px-2 rounded-xl border border-slate-300 text-xs font-bold text-slate-700 bg-white hover:bg-amber-50 hover:border-amber-300 hover:text-amber-600 transition shadow-sm truncate">☀ Warm</button>
                        <button type="button" onclick="selectTemperature('COLD', this)" class="temp-btn py-3 px-2 rounded-xl border border-slate-300 text-xs font-bold text-slate-700 bg-white hover:bg-blue-50 hover:border-blue-300 hover:text-blue-600 transition shadow-sm truncate">❄️ Cold</button>
                    </div>
                    <input type="hidden" id="leadTemperature" value="">
                </div>

                <!-- FULL REQUIREMENT CAPTURE SECTION -->
                <div id="stepRequirements" class="p-3.5 sm:p-4 bg-blue-50/50 rounded-2xl border border-blue-200 space-y-3 hidden fade-in">
                    <label class="block text-[11px] font-extrabold text-blue-900 uppercase tracking-wider">4. Client Property Requirements</label>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-600 uppercase mb-1">Budget</label>
                            <input type="text" id="requirementBudget" placeholder="e.g. 1.5 Cr" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-600 uppercase mb-1">Flat Size</label>
                            <input type="text" id="requirementFlatSize" placeholder="e.g. 3 BHK" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-600 uppercase mb-1">Preferred Floor</label>
                            <input type="text" id="requirementFloor" placeholder="e.g. 12th Floor" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 uppercase mb-1">Requirement Notes</label>
                        <textarea id="requirementNote" rows="2" placeholder="Specific notes on configuration, facing, etc..." class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm"></textarea>
                    </div>
                </div>

                <div id="stepConnectedFollowUp" class="p-3.5 sm:p-4 bg-slate-50/80 rounded-2xl border border-slate-200 space-y-3 hidden fade-in">
                    <label class="block text-[11px] font-extrabold text-blue-900 uppercase tracking-wider">5. Follow-up Required?</label>
                    <select id="followUpRequired" onchange="onConnectedFollowUpChange()" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-3 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition shadow-sm">
                        <option value="" disabled selected>Select follow-up option...</option>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                    <div id="followUpDateTimeSection" class="grid grid-cols-1 sm:grid-cols-2 gap-3 hidden pt-1">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Follow-up Date</label>
                            <input type="date" id="followUpDate" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Follow-up Time</label>
                            <input type="time" id="followUpTime" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                        </div>
                    </div>
                </div>

                <div id="stepConnectedVisit" class="p-3.5 sm:p-4 bg-slate-50/80 rounded-2xl border border-slate-200 space-y-3 hidden fade-in">
                    <label class="block text-[11px] font-extrabold text-blue-900 uppercase tracking-wider">6. Visit Scheduled?</label>
                    <select id="visitScheduled" onchange="onConnectedVisitChange()" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-3 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition shadow-sm">
                        <option value="" disabled selected>Select visit option...</option>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                    <div id="visitDateTimeSection" class="space-y-3 hidden pt-1">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Visit Date</label>
                                <input type="date" id="visitDate" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Visit Time</label>
                                <input type="time" id="visitTime" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                            </div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Building Name / Project</label>
                                <input type="text" id="visitBuilding" placeholder="e.g. Prestige Heights" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Location / Address</label>
                                <input type="text" id="visitLocation" placeholder="e.g. Andheri West, Mumbai" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                            </div>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Site Visit Proposed Details / Notes</label>
                            <textarea id="visitNote" rows="2" placeholder="Enter meeting point, executive assigned, or visit guidelines..." class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm"></textarea>
                        </div>
                    </div>
                </div>

                <!-- NOT CONNECTED FLOW -->
                <div id="stepNotConnectedSub" class="p-3.5 sm:p-4 bg-slate-50/80 rounded-2xl border border-slate-200 space-y-2 hidden fade-in">
                    <label class="block text-[11px] font-extrabold text-blue-900 uppercase tracking-wider">2. Select Specific Remark / Detail</label>
                    <select id="notConnectedSubOption" onchange="showNotConnectedCloseLead()" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-3 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition shadow-sm">
                        <option value="" disabled selected>Choose call failure reason...</option>
                        <option value="Call Not Connected">Call Not Connected</option>
                        <option value="Ringing But No Answer">Ringing But No Answer</option>
                        <option value="Busy on Another Call">Busy on Another Call</option>
                        <option value="Phone Switched Off">Phone Switched Off</option>
                        <option value="Number Not Reachable">Number Not Reachable</option>
                        <option value="Invalid / Wrong Number">Invalid / Wrong Number</option>
                        <option value="Incoming Calls Not Available">Incoming Calls Not Available</option>
                        <option value="Client Disconnected the Call">Client Disconnected the Call</option>
                        <option value="Client Requested WhatsApp Communication">Client Requested WhatsApp Communication</option>
                        <option value="Call Back Requested">Call Back Requested</option>
                    </select>
                </div>

                <div id="stepCloseLead" class="p-3.5 sm:p-4 bg-slate-50/80 rounded-2xl border border-slate-200 space-y-3 hidden fade-in">
                    <label class="block text-[11px] font-extrabold text-blue-900 uppercase tracking-wider">3. Close Lead (Unsuccessful Lead)?</label>
                    <select id="closeLeadOption" onchange="onCloseLeadChange()" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-3 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition shadow-sm">
                        <option value="" disabled selected>Select option...</option>
                        <option value="Yes">Yes, Close Lead</option>
                        <option value="No">No, Keep Active</option>
                    </select>
                    <div id="closeReasonSection" class="space-y-1 hidden pt-1">
                        <label class="block text-[10px] font-extrabold text-rose-600 uppercase tracking-wider mb-1">Reason for Closing Lead</label>
                        <input type="text" id="closeLeadReason" placeholder="Enter reason..." class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-3 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-rose-500 shadow-sm">
                    </div>
                </div>

                <div id="stepNotConnectedFollowUp" class="p-3.5 sm:p-4 bg-slate-50/80 rounded-2xl border border-slate-200 space-y-3 hidden fade-in">
                    <label class="block text-[11px] font-extrabold text-blue-900 uppercase tracking-wider">4. Follow-up Required?</label>
                    <select id="notConnectedFollowUpRequired" onchange="onNotConnectedFollowUpChange()" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-3 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition shadow-sm">
                        <option value="" disabled selected>Select follow-up option...</option>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                    <div id="ncFollowUpDateTimeSection" class="grid grid-cols-1 sm:grid-cols-2 gap-3 hidden pt-1">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Follow-up Date</label>
                            <input type="date" id="ncFollowUpDate" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Follow-up Time</label>
                            <input type="time" id="ncFollowUpTime" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                        </div>
                    </div>
                </div>

                <div id="stepNotConnectedVisit" class="p-3.5 sm:p-4 bg-slate-50/80 rounded-2xl border border-slate-200 space-y-3 hidden fade-in">
                    <label class="block text-[11px] font-extrabold text-blue-900 uppercase tracking-wider">5. Visit Scheduled?</label>
                    <select id="ncVisitScheduled" onchange="onNcVisitChange()" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-3 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition shadow-sm">
                        <option value="" disabled selected>Select visit option...</option>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                    <div id="ncVisitDateTimeSection" class="space-y-3 hidden pt-1">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Visit Date</label>
                                <input type="date" id="ncVisitDate" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Visit Time</label>
                                <input type="time" id="ncVisitTime" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                            </div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Building Name / Project</label>
                                <input type="text" id="ncVisitBuilding" placeholder="e.g. Prestige Heights" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Location / Address</label>
                                <input type="text" id="ncVisitLocation" placeholder="e.g. Andheri West, Mumbai" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                            </div>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Site Visit Proposed Details / Notes</label>
                            <textarea id="ncVisitNote" rows="2" placeholder="Enter meeting point, executive assigned, or visit guidelines..." class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Remarks & Submit -->
                <div id="stepSubmit" class="p-3.5 sm:p-4 bg-slate-50/80 rounded-2xl border border-slate-200 space-y-3 hidden fade-in">
                    <label class="block text-[11px] font-extrabold text-blue-900 uppercase tracking-wider">Call Remarks / General Notes</label>
                    <textarea id="callRemarks" rows="3" placeholder="Enter conversation details or notes..." class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-3 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition shadow-sm"></textarea>

                    <button onclick="saveCallLog()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 sm:py-4 px-4 rounded-xl shadow-lg shadow-blue-600/25 transition text-sm flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-check-circle"></i>
                        <span>Save & Submit Call Log</span>
                    </button>
                </div>
            </div>

            <!-- ================= TAB 2: CUSTOMER HISTORY ================= -->
            <div id="sectionCustomerHistory" class="space-y-4 hidden fade-in">
                <div class="space-y-3 max-h-[420px] sm:max-h-[480px] overflow-y-auto pr-1" id="historyTimelineContainer">
                    <p class="text-xs text-slate-400 text-center py-8">Loading customer history...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const taskId = urlParams.get('taskId') || urlParams.get('id');
        const currentUsername = urlParams.get('username') || localStorage.getItem('crm_username') || 'admin';

        let taskData = {};

        async function fetchLeadData() {
            if (!taskId) {
                alert('No Task ID provided in URL!');
                window.location.href = 'followups.html';
                return;
            }

            try {
                const res = await fetch(`/api/lead-details/${encodeURIComponent(currentUsername)}/${encodeURIComponent(taskId)}`);
                const data = await res.json();
                
                if (data.success && data.lead) {
                    taskData = data.lead;
                    loadLeadUI(taskData);
                    return;
                }
                
                alert('Lead details not found.');
                window.location.href = 'followups.html';
            } catch (err) {
                console.error('Error fetching lead details:', err);
                alert('Failed to connect to backend server.');
            }
        }

        function loadLeadUI(lead) {
            taskData = lead;
            const name = lead.name || 'Untitled Lead';
            const contact = lead.contactNumber || 'N/A';
            const description = lead.description || 'Active Real Estate Lead';

            document.getElementById('panelLeadName').textContent = name;
            document.getElementById('panelLeadContact').textContent = contact;
            document.getElementById('leadDescription').textContent = description;

            // Bind telephone link for direct dialing when clicking Call Now
            const callBtn = document.getElementById('callNowBtn');
            if (contact && contact !== 'N/A') {
                callBtn.setAttribute('href', `tel:${contact}`);
            } else {
                callBtn.onclick = (e) => {
                    e.preventDefault();
                    alert('No valid contact number available for this lead.');
                };
            }
        }

        function triggerDirectCall(event) {
            const contact = taskData.contactNumber;
            if (!contact || contact === 'N/A') {
                event.preventDefault();
                alert('Contact number is not available.');
            }
        }

        function switchTab(tab) {
            const btnInput = document.getElementById('tabCallInput');
            const btnHistory = document.getElementById('tabCustomerHistory');
            const secInput = document.getElementById('sectionCallInput');
            const secHistory = document.getElementById('sectionCustomerHistory');

            if (tab === 'input') {
                btnInput.className = "py-2.5 px-3 rounded-lg text-xs font-bold transition bg-blue-600 text-white shadow-sm flex items-center justify-center space-x-1.5 truncate";
                btnHistory.className = "py-2.5 px-3 rounded-lg text-xs font-bold transition text-slate-600 hover:text-slate-900 flex items-center justify-center space-x-1.5 truncate";
                secInput.classList.remove('hidden');
                secHistory.classList.add('hidden');
            } else {
                btnHistory.className = "py-2.5 px-3 rounded-lg text-xs font-bold transition bg-blue-600 text-white shadow-sm flex items-center justify-center space-x-1.5 truncate";
                btnInput.className = "py-2.5 px-3 rounded-lg text-xs font-bold transition text-slate-600 hover:text-slate-900 flex items-center justify-center space-x-1.5 truncate";
                secHistory.classList.remove('hidden');
                secInput.classList.add('hidden');
                renderCustomerHistory();
            }
        }

        function renderCustomerHistory() {
            const container = document.getElementById('historyTimelineContainer');
            container.innerHTML = '';

            let calls = [];
            let i = 1;
            while (taskData && taskData[`call${i}`]) {
                calls.push({ callNum: `Call ${i}`, data: taskData[`call${i}`] });
                i++;
            }

            if (calls.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-8">No call history logged yet for this lead.</p>`;
                return;
            }

            calls.reverse().forEach(({ callNum, data }) => {
                const isConnected = data.call_connected === 'Yes' || data.call_connected === 'Connected';
                
                const connectedBadge = isConnected 
                    ? `<span class="inline-flex items-center bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-0.5 rounded-full text-[9px] sm:text-[10px] font-extrabold tracking-wide uppercase flex-shrink-0"><i class="fa-solid fa-phone-volume mr-1 text-emerald-600"></i> Connected</span>`
                    : `<span class="inline-flex items-center bg-rose-50 text-rose-700 border border-rose-200 px-2.5 py-0.5 rounded-full text-[9px] sm:text-[10px] font-extrabold tracking-wide uppercase flex-shrink-0"><i class="fa-solid fa-phone-slash mr-1 text-rose-600"></i> ${data.call_connected || 'Call Not Connected'}</span>`;

                const detailsHtml = `
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 bg-slate-50/90 p-3 sm:p-4 rounded-2xl border border-slate-200 my-2 text-xs">
                        <div class="overflow-hidden">
                            <span class="text-slate-400 uppercase text-[9px] font-extrabold tracking-wider block mb-0.5">Title</span>
                            <span class="text-slate-800 font-bold block truncate">${data.title || 'N/A'}</span>
                        </div>
                        <div class="overflow-hidden">
                            <span class="text-slate-400 uppercase text-[9px] font-extrabold tracking-wider block mb-0.5">Call Connected</span>
                            <span class="text-slate-800 font-bold block truncate">${data.call_connected || 'N/A'}</span>
                        </div>
                        <div class="overflow-hidden">
                            <span class="text-slate-400 uppercase text-[9px] font-extrabold tracking-wider block mb-0.5">Remark</span>
                            <span class="text-slate-800 font-semibold italic block break-words">${data.remark || 'N/A'}</span>
                        </div>
                        <div class="overflow-hidden">
                            <span class="text-slate-400 uppercase text-[9px] font-extrabold tracking-wider block mb-0.5">Follow-Up Required</span>
                            <span class="text-slate-800 font-bold block truncate">${data.followUpRequired || 'N/A'}</span>
                        </div>
                        <div class="overflow-hidden">
                            <span class="text-slate-400 uppercase text-[9px] font-extrabold tracking-wider block mb-0.5">Follow-Up Option</span>
                            <span class="text-slate-800 font-semibold block truncate">${data.followUpOption || 'N/A'}</span>
                        </div>
                        <div class="overflow-hidden">
                            <span class="text-slate-400 uppercase text-[9px] font-extrabold tracking-wider block mb-0.5">Follow-Up Date & Time</span>
                            <span class="text-slate-800 font-semibold block truncate">${data.followUpDate || 'N/A'} ${data.followUpTime ? '@ ' + data.followUpTime : ''}</span>
                        </div>
                        <div class="overflow-hidden">
                            <span class="text-slate-400 uppercase text-[9px] font-extrabold tracking-wider block mb-0.5">Visit Scheduled</span>
                            <span class="text-slate-800 font-bold block truncate">${data.visitScheduled || 'N/A'}</span>
                        </div>
                        <div class="overflow-hidden">
                            <span class="text-slate-400 uppercase text-[9px] font-extrabold tracking-wider block mb-0.5">Visit Date & Time</span>
                            <span class="text-slate-800 font-semibold block truncate">${data.visitDate || 'N/A'} ${data.visitTime ? '@ ' + data.visitTime : ''}</span>
                        </div>
                        <div class="overflow-hidden">
                            <span class="text-slate-400 uppercase text-[9px] font-extrabold tracking-wider block mb-0.5">Building Name / Project</span>
                            <span class="text-slate-800 font-semibold block truncate">${data.visitBuilding || 'N/A'}</span>
                        </div>
                        <div class="overflow-hidden">
                            <span class="text-slate-400 uppercase text-[9px] font-extrabold tracking-wider block mb-0.5">Location / Address</span>
                            <span class="text-slate-800 font-semibold block truncate">${data.visitLocation || 'N/A'}</span>
                        </div>
                        <div class="overflow-hidden">
                            <span class="text-slate-400 uppercase text-[9px] font-extrabold tracking-wider block mb-0.5">Site Visit Proposed Details / Notes</span>
                            <span class="text-slate-800 font-semibold block break-words">${data.visitNote || 'N/A'}</span>
                        </div>
                        <div class="overflow-hidden">
                            <span class="text-slate-400 uppercase text-[9px] font-extrabold tracking-wider block mb-0.5">Lead Status</span>
                            <span class="text-slate-800 font-bold block truncate">${data.leadStatus || 'N/A'}</span>
                        </div>
                        <div class="overflow-hidden">
                            <span class="text-slate-400 uppercase text-[9px] font-extrabold tracking-wider block mb-0.5">Close Reason</span>
                            <span class="text-slate-800 font-semibold text-rose-600 block break-words">${data.closeReason || 'N/A'}</span>
                        </div>
                    </div>
                `;

                const dateStr = data.loggedAt ? new Date(data.loggedAt).toLocaleString() : '';

                const card = document.createElement('div');
                card.className = "bg-white p-4 sm:p-5 rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition space-y-3";
                card.innerHTML = `
                    <div class="flex flex-col xs:flex-row xs:items-center justify-between gap-2 pb-2 border-b border-slate-100">
                        <span class="text-xs font-extrabold text-slate-900 bg-slate-100 px-3 py-1 rounded-lg flex items-center space-x-1 w-fit"><i class="fa-solid fa-headset text-blue-600 mr-1.5"></i> ${callNum}</span>
                        <div class="flex items-center justify-between xs:justify-end space-x-2 sm:space-x-3">
                            ${connectedBadge}
                            <span class="text-[10px] sm:text-[11px] font-medium text-slate-400 whitespace-nowrap"><i class="fa-regular fa-calendar mr-1"></i> ${dateStr}</span>
                        </div>
                    </div>
                    <div>
                        ${detailsHtml}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Wizard UI Handlers
        function onConnectionChange() {
            const connected = document.getElementById('callConnected').value;
            document.getElementById('stepConnectedSub').classList.add('hidden');
            document.getElementById('stepConnectedCloseLead').classList.add('hidden');
            document.getElementById('stepConnectedTemp').classList.add('hidden');
            document.getElementById('stepRequirements').classList.add('hidden');
            document.getElementById('stepConnectedFollowUp').classList.add('hidden');
            document.getElementById('stepConnectedVisit').classList.add('hidden');
            document.getElementById('stepNotConnectedSub').classList.add('hidden');
            document.getElementById('stepCloseLead').classList.add('hidden');
            document.getElementById('stepNotConnectedFollowUp').classList.add('hidden');
            document.getElementById('stepNotConnectedVisit').classList.add('hidden');
            document.getElementById('stepSubmit').classList.add('hidden');

            if (connected === 'Yes') {
                document.getElementById('stepConnectedSub').classList.remove('hidden');
            } else if (connected === 'No') {
                document.getElementById('stepNotConnectedSub').classList.remove('hidden');
            }
        }

        function showConnectedCloseLead() {
            document.getElementById('stepConnectedCloseLead').classList.remove('hidden');
        }

        function onConnectedCloseLeadChange() {
            const closeReq = document.getElementById('connectedCloseLeadOption').value;
            const reasonSec = document.getElementById('connectedCloseReasonSection');
            if (closeReq === 'Yes') {
                reasonSec.classList.remove('hidden');
                document.getElementById('stepConnectedTemp').classList.add('hidden');
                document.getElementById('stepRequirements').classList.add('hidden');
                document.getElementById('stepConnectedFollowUp').classList.add('hidden');
                document.getElementById('stepConnectedVisit').classList.add('hidden');
                document.getElementById('stepSubmit').classList.remove('hidden');
            } else {
                reasonSec.classList.add('hidden');
                document.getElementById('stepConnectedTemp').classList.remove('hidden');
            }
        }

        function selectTemperature(temp, btnElement) {
            document.getElementById('leadTemperature').value = temp;
            document.querySelectorAll('.temp-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white', 'border-blue-500', 'shadow-sm');
                btn.classList.add('bg-white', 'text-slate-700', 'border-slate-300');
            });
            btnElement.classList.remove('bg-white', 'text-slate-700', 'border-slate-300');
            btnElement.classList.add('bg-blue-600', 'text-white', 'border-blue-500', 'shadow-sm');
            document.getElementById('stepRequirements').classList.remove('hidden');
            document.getElementById('stepConnectedFollowUp').classList.remove('hidden');
        }

        function onConnectedFollowUpChange() {
            const followUpReq = document.getElementById('followUpRequired').value;
            const dateTimeSec = document.getElementById('followUpDateTimeSection');
            if (followUpReq === 'Yes') {
                dateTimeSec.classList.remove('hidden');
                document.getElementById('stepConnectedVisit').classList.add('hidden');
                document.getElementById('visitScheduled').value = 'No';
                document.getElementById('visitDateTimeSection').classList.add('hidden');
                document.getElementById('stepSubmit').classList.remove('hidden');
            } else {
                dateTimeSec.classList.add('hidden');
                document.getElementById('stepConnectedVisit').classList.remove('hidden');
            }
        }

        function onConnectedVisitChange() {
            const visitReq = document.getElementById('visitScheduled').value;
            const dateTimeSec = document.getElementById('visitDateTimeSection');
            if (visitReq === 'Yes') {
                dateTimeSec.classList.remove('hidden');
            } else {
                dateTimeSec.classList.add('hidden');
            }
            document.getElementById('stepSubmit').classList.remove('hidden');
        }

        function showNotConnectedCloseLead() {
            document.getElementById('stepCloseLead').classList.remove('hidden');
        }

        function onCloseLeadChange() {
            const closeReq = document.getElementById('closeLeadOption').value;
            const reasonSec = document.getElementById('closeReasonSection');
            if (closeReq === 'Yes') {
                reasonSec.classList.remove('hidden');
                document.getElementById('stepNotConnectedFollowUp').classList.add('hidden');
                document.getElementById('stepNotConnectedVisit').classList.add('hidden');
                document.getElementById('stepSubmit').classList.remove('hidden');
            } else {
                reasonSec.classList.add('hidden');
                document.getElementById('stepNotConnectedFollowUp').classList.remove('hidden');
            }
        }

        function onNotConnectedFollowUpChange() {
            const followUpReq = document.getElementById('notConnectedFollowUpRequired').value;
            const ncDateTimeSec = document.getElementById('ncFollowUpDateTimeSection');
            if (followUpReq === 'Yes') {
                ncDateTimeSec.classList.remove('hidden');
                document.getElementById('stepNotConnectedVisit').classList.add('hidden');
                document.getElementById('ncVisitScheduled').value = 'No';
                document.getElementById('ncVisitDateTimeSection').classList.add('hidden');
                document.getElementById('stepSubmit').classList.remove('hidden');
            } else {
                ncDateTimeSec.classList.add('hidden');
                document.getElementById('stepNotConnectedVisit').classList.remove('hidden');
            }
        }

        function onNcVisitChange() {
            const visitReq = document.getElementById('ncVisitScheduled').value;
            const dateTimeSec = document.getElementById('ncVisitDateTimeSection');
            if (visitReq === 'Yes') {
                dateTimeSec.classList.remove('hidden');
            } else {
                dateTimeSec.classList.add('hidden');
            }
            document.getElementById('stepSubmit').classList.remove('hidden');
        }

        async function saveCallLog() {
            const connectedStatus = document.getElementById('callConnected').value;
            const remarksText = document.getElementById('callRemarks').value;

            let callPayload = {
                call_connected: connectedStatus,
                remark: remarksText || connectedStatus,
                leadStatus: '',
                closeReason: '',
                requirementBudget: document.getElementById('requirementBudget').value,
                requirementFlatSize: document.getElementById('requirementFlatSize').value,
                requirementFloor: document.getElementById('requirementFloor').value,
                requirementNote: document.getElementById('requirementNote').value
            };

            if (connectedStatus === 'Yes') {
                const closeReq = document.getElementById('connectedCloseLeadOption').value;
                callPayload.tempSubOption = document.getElementById('tempSubOption').value;

                if (closeReq === 'Yes') {
                    callPayload.leadStatus = 'Closed Lead';
                    callPayload.closeReason = document.getElementById('connectedCloseLeadReason').value || 'No reason provided';
                    callPayload.followUpRequired = 'No';
                    callPayload.visitScheduled = 'No';
                } else {
                    const followUpReq = document.getElementById('followUpRequired').value;
                    const visitReq = document.getElementById('visitScheduled').value;

                    callPayload.leadTemperature = document.getElementById('leadTemperature').value;
                    callPayload.followUpRequired = followUpReq;
                    callPayload.visitScheduled = followUpReq === 'Yes' ? 'No' : visitReq;

                    if (followUpReq === 'Yes') {
                        callPayload.followUpDate = document.getElementById('followUpDate').value;
                        callPayload.followUpTime = document.getElementById('followUpTime').value;
                    } else if (visitReq === 'Yes') {
                        callPayload.visitDate = document.getElementById('visitDate').value;
                        callPayload.visitTime = document.getElementById('visitTime').value;
                        callPayload.visitBuilding = document.getElementById('visitBuilding').value;
                        callPayload.visitLocation = document.getElementById('visitLocation').value;
                        callPayload.visitNote = document.getElementById('visitNote').value;
                    }
                }
            } else {
                const closeReq = document.getElementById('closeLeadOption').value;
                const ncFollowUpReq = document.getElementById('notConnectedFollowUpRequired').value;
                const ncVisitReq = document.getElementById('ncVisitScheduled').value;

                callPayload.tempSubOption = document.getElementById('notConnectedSubOption').value;

                if (closeReq === 'Yes') {
                    callPayload.leadStatus = 'Closed Lead';
                    callPayload.closeReason = document.getElementById('closeLeadReason').value || 'No reason provided';
                    callPayload.followUpRequired = 'No';
                    callPayload.visitScheduled = 'No';
                } else {
                    callPayload.followUpRequired = ncFollowUpReq;
                    callPayload.visitScheduled = ncFollowUpReq === 'Yes' ? 'No' : ncVisitReq;

                    if (ncFollowUpReq === 'Yes') {
                        callPayload.followUpDate = document.getElementById('ncFollowUpDate').value;
                        callPayload.followUpTime = document.getElementById('ncFollowUpTime').value;
                    } else if (ncVisitReq === 'Yes') {
                        callPayload.visitDate = document.getElementById('ncVisitDate').value;
                        callPayload.visitTime = document.getElementById('ncVisitTime').value;
                        callPayload.visitBuilding = document.getElementById('ncVisitBuilding').value;
                        callPayload.visitLocation = document.getElementById('ncVisitLocation').value;
                        callPayload.visitNote = document.getElementById('ncVisitNote').value;
                    }
                }
            }

            try {
                const res = await fetch(`/api/update-task-status/${encodeURIComponent(currentUsername)}/${taskId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(callPayload)
                });
                const result = await res.json();

                if (result.success) {
                    alert('Call logged successfully!');
                    window.location.href = 'followups.html';
                } else {
                    alert('Error saving call log: ' + (result.message || 'Unknown error'));
                }
            } catch (err) {
                console.error('Error saving call log:', err);
                alert('Server connection error while saving call log.');
            }
        }

        // Initialize Lead Data on load
        fetchLeadData();
    </script>
</body>
</html>
