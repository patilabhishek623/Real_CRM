        ::-webkit-scrollbar-track { background: #f8fafc; }

<body class="bg-gradient-to-br from-slate-100 via-blue-50/30 to-slate-200 min-h-screen text-slate-800 flex items-center justify-center p-4 sm:p-6 relative">

    <!-- Top Right Executive Back Button -->

        <!-- ================= LEFT SIDE PANEL: BRANDING & SUMMARY ================= -->

            <div class="relative z-10 space-y-4">

                </div>
                <div>
                    <span class="px-2.5 py-1 rounded-md text-[10px] font-extrabold tracking-wider uppercase bg-blue-500/20 text-blue-300 border border-blue-400/30">Real_Crm Hub</span>
                    <h2 class="text-xl font-extrabold tracking-tight text-white mt-2" id="panelLeadName">Sneha Gupta</h2>
                    <p class="text-xs font-medium text-blue-200/80 mt-1 flex items-center">
                        <i class="fa-solid fa-phone mr-1.5 text-[10px]"></i> <span id="panelLeadContact">9112233445</span>
                    </p>
                </div>
            </div>

            <div class="relative z-10 pt-4 border-t border-white/10 space-y-3">

                <!-- FULL REQUIREMENT CAPTURE SECTION -->

                        <div>

                            <input type="time" id="visitTime" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">

                <div id="stepNotConnectedFollowUp" class="p-4 bg-slate-50/80 rounded-2xl border border-slate-200 space-y-3 hidden fade-in">

                    <select id="notConnectedFollowUpRequired" onchange="onNotConnectedFollowUpChange()" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition shadow-sm">
                        <option value="" disabled selected>Select follow-up option...</option>
                        <option value="Yes">Yes</option>

                    <div id="ncFollowUpDateTimeSection" class="grid grid-cols-2 gap-3 hidden pt-1">

                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Follow-up Date</label>
                            <input type="date" id="ncFollowUpDate" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">

                        <option value="Yes">Yes</option>

                            <input type="time" id="ncVisitTime" class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">

                <!-- Remarks & Submit -->
                <div id="stepSubmit" class="p-4 bg-slate-50/80 rounded-2xl border border-slate-200 space-y-3 hidden fade-in">

                    <textarea id="callRemarks" rows="3" placeholder="Enter conversation details or notes..." class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition shadow-sm"></textarea>

                    <button onclick="saveCallLog()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded-xl shadow-lg shadow-blue-600/25 transition text-sm flex items-center justify-center space-x-2">

            <!-- ================= TAB 2: CUSTOMER HISTORY ================= -->
            <div id="sectionCustomerHistory" class="space-y-4 hidden fade-in">

                    <p class="text-xs text-slate-400 text-center py-8">Loading customer history...</p>
                </div>
            </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const taskId = urlParams.get('id');
        let currentUsername = localStorage.getItem('crm_username') || 'admin';

        let taskData = {};

        async function fetchLeadData() {
            if (!taskId) {
                loadLeadUI({
                    name: "Sneha Gupta",
                    contactNumber: "9112233445",
                    description: "Imported via Excel lead sheet",
                    call2: {
                        call_connected: "Yes",
                        tempSubOption: "Interested – Wants Project Details",
                        leadTemperature: "HOT",
                        requirementBudget: "asd",
                        requirementFlatSize: "asd",
                        requirementFloor: "asd",
                        requirementNote: "asd",
                        followUpRequired: "Yes",
                        followUpOption: "Call After 3 Days",
                        followUpDate: "2026-10-21",
                        followUpTime: "15:50",
                        visitScheduled: "No",
                        remark: "adsd",
                        loggedAt: "2026-10-03T12:50:51.000+00:00"
                    },
                    call1: {
                        call_connected: "Call Not Connected",
                        tempSubOption: "Just checking prices",
                        leadTemperature: "COLD",
                        requirementBudget: "asd",
                        requirementFlatSize: "assd",
                        requirementFloor: "123",
                        requirementNote: "asd",
                        followUpRequired: "Yes",
                        followUpOption: "Call After 2 Days",
                        followUpDate: "2026-10-04",
                        followUpTime: "12:15",
                        visitScheduled: "No",
                        remark: "Call Not Connected",
                        loggedAt: "2026-10-03T12:15:03.000+00:00"
                    }
                });
                return;
            }

            try {
                const res = await fetch(`/api/lead-details/${encodeURIComponent(currentUsername)}/${taskId}`);
                const data = await res.json();
                
                if (data.success && data.lead) {
                    taskData = data.lead;
                    loadLeadUI(taskData);
                    return;
                }
                
                loadLeadUI({
                    name: "Sneha Gupta",
                    contactNumber: "9112233445",
                    description: "Lead ID: " + taskId
                });
            } catch (err) {
                console.error('Error fetching lead details:', err);
                loadLeadUI({
                    name: "Sneha Gupta",
                    contactNumber: "9112233445",
                    description: "Active Real Estate Lead"
                });
            }
        }

        function loadLeadUI(lead) {
            taskData = lead;
            const name = lead.name || 'Sneha Gupta';
            const contact = lead.contactNumber || '9112233445';
            const description = lead.description || 'Active Real Estate Lead';

            document.getElementById('panelLeadName').textContent = name;
            document.getElementById('panelLeadContact').textContent = contact;
            document.getElementById('leadDescription').textContent = description;
        }

        function switchTab(tab) {
            const btnInput = document.getElementById('tabCallInput');
            const btnHistory = document.getElementById('tabCustomerHistory');
            const secInput = document.getElementById('sectionCallInput');
            const secHistory = document.getElementById('sectionCustomerHistory');

            if (tab === 'input') {
                btnInput.className = "py-2.5 px-4 rounded-lg text-xs font-bold transition bg-blue-600 text-white shadow-sm flex items-center justify-center space-x-2";
                btnHistory.className = "py-2.5 px-4 rounded-lg text-xs font-bold transition text-slate-600 hover:text-slate-900 flex items-center justify-center space-x-2";
                secInput.classList.remove('hidden');
                secHistory.classList.add('hidden');
            } else {
                btnHistory.className = "py-2.5 px-4 rounded-lg text-xs font-bold transition bg-blue-600 text-white shadow-sm flex items-center justify-center space-x-2";
                btnInput.className = "py-2.5 px-4 rounded-lg text-xs font-bold transition text-slate-600 hover:text-slate-900 flex items-center justify-center space-x-2";
                secHistory.classList.remove('hidden');
                secInput.classList.add('hidden');
                renderCustomerHistory();
            }
        }

        function renderCustomerHistory() {
            const container = document.getElementById('historyTimelineContainer');
            container.innerHTML = '';

            let calls = [];
            let i = 1;
            while (taskData && taskData[`call${i}`]) {
                calls.push({ callNum: `Call ${i}`, data: taskData[`call${i}`] });
                i++;
            }

            if (calls.length === 0) {
                calls.push({
                    callNum: "Call 1",
                    data: {
                        call_connected: "Call Not Connected",
                        tempSubOption: "Just checking prices",
                        leadTemperature: "COLD",
                        requirementBudget: "asd",
                        requirementFlatSize: "assd",
                        requirementFloor: "123",
                        requirementNote: "asd",
                        followUpRequired: "Yes",
                        followUpOption: "Call After 2 Days",
                        followUpDate: "2026-10-04",
                        followUpTime: "12:15",
                        visitScheduled: "No",
                        remark: "Call Not Connected",
                        loggedAt: "2026-10-03T12:15:03.000+00:00"
                    }
                });
            }

            calls.reverse().forEach(({ callNum, data }) => {
                const isClosed = data.leadStatus === 'Closed Lead';
                const isConnected = data.call_connected === 'Yes' || data.call_connected === 'Connected';
                
                const connectedBadge = isConnected 
                    ? `<span class="inline-flex items-center bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-full text-[10px] font-extrabold tracking-wide uppercase"><i class="fa-solid fa-phone-volume mr-1.5 text-emerald-600"></i> Connected</span>`
                    : `<span class="inline-flex items-center bg-rose-50 text-rose-700 border border-rose-200 px-3 py-1 rounded-full text-[10px] font-extrabold tracking-wide uppercase"><i class="fa-solid fa-phone-slash mr-1.5 text-rose-600"></i> ${data.call_connected || 'Call Not Connected'}</span>`;

                let detailsHtml = '';
                if (isClosed) {
                    detailsHtml += `<div class="p-3.5 bg-rose-50 border border-rose-100 rounded-xl mt-3"><p class="text-xs text-rose-700 font-bold"><i class="fa-solid fa-triangle-exclamation mr-1.5"></i> Lead Closed: ${data.closeReason || 'No reason specified'}</p></div>`;
                } else {
                    let gridItems = '';
                    if (data.tempSubOption) gridItems += `<div><span class="text-slate-400 uppercase text-[9px] font-extrabold tracking-wider block mb-0.5">Detail / Remark</span><span class="text-slate-700 text-xs font-semibold">${data.tempSubOption}</span></div>`;
                    if (data.leadTemperature) {
                        const tempColor = data.leadTemperature === 'HOT' ? 'bg-rose-100 text-rose-700 border-rose-200' : data.leadTemperature === 'WARM' ? 'bg-amber-100 text-amber-700 border-amber-200' : 'bg-blue-100 text-blue-700 border-blue-200';
                        gridItems += `<div><span class="text-slate-400 uppercase text-[9px] font-extrabold tracking-wider block mb-0.5">Lead Temperature</span><span class="inline-block px-2 py-0.5 rounded border text-[11px] font-bold ${tempColor}">${data.leadTemperature}</span></div>`;
                    }
                    if (data.requirementBudget) gridItems += `<div><span class="text-slate-400 uppercase text-[9px] font-extrabold tracking-wider block mb-0.5">Budget</span><span class="text-slate-700 text-xs font-semibold">${data.requirementBudget}</span></div>`;
                    if (data.requirementFlatSize) gridItems += `<div><span class="text-slate-400 uppercase text-[9px] font-extrabold tracking-wider block mb-0.5">Flat Size</span><span class="text-slate-700 text-xs font-semibold">${data.requirementFlatSize}</span></div>`;
                    if (data.requirementFloor) gridItems += `<div><span class="text-slate-400 uppercase text-[9px] font-extrabold tracking-wider block mb-0.5">Preferred Floor</span><span class="text-slate-700 text-xs font-semibold">${data.requirementFloor}</span></div>`;
                    if (data.requirementNote) gridItems += `<div class="col-span-2"><span class="text-slate-400 uppercase text-[9px] font-extrabold tracking-wider block mb-0.5">Requirement Notes</span><span class="text-slate-700 text-xs">${data.requirementNote}</span></div>`;
                    
                    if (gridItems) {
                        detailsHtml += `<div class="grid grid-cols-2 gap-3 bg-slate-50/80 p-3.5 rounded-xl border border-slate-100 my-3">${gridItems}</div>`;
                    }

                    if (data.followUpRequired === 'Yes') {
                        detailsHtml += `<div class="flex items-center space-x-2 text-xs text-blue-700 bg-blue-50/60 p-2.5 rounded-xl border border-blue-100 mt-2 font-medium"><i class="fa-regular fa-clock text-blue-500"></i><span><strong>Follow-up Scheduled:</strong> ${data.followUpDate} at ${data.followUpTime} ${data.followUpOption ? '(' + data.followUpOption + ')' : ''}</span></div>`;
                    }
                    if (data.visitScheduled === 'Yes') {
                        detailsHtml += `<div class="flex items-center space-x-2 text-xs text-emerald-700 bg-emerald-50/60 p-2.5 rounded-xl border border-emerald-100 mt-2 font-medium"><i class="fa-solid fa-calendar-check text-emerald-500"></i><span><strong>Site Visit:</strong> ${data.visitDate} at ${data.visitTime}</span></div>`;
                    }
                }
                if (data.remark && data.remark !== data.call_connected) {
                    detailsHtml += `
                        <div class="mt-3 bg-slate-50 p-3.5 rounded-xl border border-slate-100 space-y-1">
                            <span class="text-[9px] font-extrabold uppercase tracking-wider text-slate-400 block"><i class="fa-solid fa-comment-dots mr-1"></i> Call Remarks / Notes</span>
                            <p class="text-xs text-slate-700 font-medium">${data.remark}</p>
                        </div>
                    `;
                }

                const dateStr = data.loggedAt ? new Date(data.loggedAt).toLocaleString() : '';

                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition space-y-3";
                card.innerHTML = `
                    <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                        <span class="text-xs font-extrabold text-slate-900 bg-slate-100 px-3 py-1 rounded-lg flex items-center space-x-1"><i class="fa-solid fa-headset text-blue-600 mr-1.5"></i> ${callNum}</span>
                        <div class="flex items-center space-x-3">
                            ${connectedBadge}
                            <span class="text-[11px] font-medium text-slate-400"><i class="fa-regular fa-calendar mr-1"></i> ${dateStr}</span>
                        </div>
                    </div>
                    <div>
                        ${detailsHtml}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Wizard UI Handlers
        function onConnectionChange() {
            const connected = document.getElementById('callConnected').value;
            document.getElementById('stepConnectedSub').classList.add('hidden');
            document.getElementById('stepConnectedCloseLead').classList.add('hidden');
            document.getElementById('stepConnectedTemp').classList.add('hidden');
            document.getElementById('stepRequirements').classList.add('hidden');
            document.getElementById('stepConnectedFollowUp').classList.add('hidden');
            document.getElementById('stepConnectedVisit').classList.add('hidden');
            document.getElementById('stepNotConnectedSub').classList.add('hidden');
            document.getElementById('stepCloseLead').classList.add('hidden');
            document.getElementById('stepNotConnectedFollowUp').classList.add('hidden');
            document.getElementById('stepNotConnectedVisit').classList.add('hidden');
            document.getElementById('stepSubmit').classList.add('hidden');

            if (connected === 'Yes') {
                document.getElementById('stepConnectedSub').classList.remove('hidden');
            } else if (connected === 'No') {
                document.getElementById('stepNotConnectedSub').classList.remove('hidden');
            }
        }

        function showConnectedCloseLead() {
            document.getElementById('stepConnectedCloseLead').classList.remove('hidden');
        }

        function onConnectedCloseLeadChange() {
            const closeReq = document.getElementById('connectedCloseLeadOption').value;
            const reasonSec = document.getElementById('connectedCloseReasonSection');
            if (closeReq === 'Yes') {
                reasonSec.classList.remove('hidden');
                document.getElementById('stepConnectedTemp').classList.add('hidden');
                document.getElementById('stepRequirements').classList.add('hidden');
                document.getElementById('stepConnectedFollowUp').classList.add('hidden');
                document.getElementById('stepConnectedVisit').classList.add('hidden');
                document.getElementById('stepSubmit').classList.remove('hidden');
            } else {
                reasonSec.classList.add('hidden');
                document.getElementById('stepConnectedTemp').classList.remove('hidden');
            }
        }

        function selectTemperature(temp, btnElement) {
            document.getElementById('leadTemperature').value = temp;
            document.querySelectorAll('.temp-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white', 'border-blue-500', 'shadow-sm');
                btn.classList.add('bg-white', 'text-slate-700', 'border-slate-300');
            });
            btnElement.classList.remove('bg-white', 'text-slate-700', 'border-slate-300');
            btnElement.classList.add('bg-blue-600', 'text-white', 'border-blue-500', 'shadow-sm');
            document.getElementById('stepRequirements').classList.remove('hidden');
            document.getElementById('stepConnectedFollowUp').classList.remove('hidden');
        }

        function onConnectedFollowUpChange() {
            const followUpReq = document.getElementById('followUpRequired').value;
            const dateTimeSec = document.getElementById('followUpDateTimeSection');
            if (followUpReq === 'Yes') {
                dateTimeSec.classList.remove('hidden');
                document.getElementById('stepConnectedVisit').classList.add('hidden');
                document.getElementById('visitScheduled').value = 'No';
                document.getElementById('visitDateTimeSection').classList.add('hidden');
                document.getElementById('stepSubmit').classList.remove('hidden');
            } else {
                dateTimeSec.classList.add('hidden');
                document.getElementById('stepConnectedVisit').classList.remove('hidden');
            }
        }

        function onConnectedVisitChange() {
            const visitReq = document.getElementById('visitScheduled').value;
            const dateTimeSec = document.getElementById('visitDateTimeSection');
            if (visitReq === 'Yes') {
                dateTimeSec.classList.remove('hidden');
            } else {
                dateTimeSec.classList.add('hidden');
            }
            document.getElementById('stepSubmit').classList.remove('hidden');
        }

        function showNotConnectedCloseLead() {
            document.getElementById('stepCloseLead').classList.remove('hidden');
        }

        function onCloseLeadChange() {
            const closeReq = document.getElementById('closeLeadOption').value;
            const reasonSec = document.getElementById('closeReasonSection');
            if (closeReq === 'Yes') {
                reasonSec.classList.remove('hidden');
                document.getElementById('stepNotConnectedFollowUp').classList.add('hidden');
                document.getElementById('stepNotConnectedVisit').classList.add('hidden');
                document.getElementById('stepSubmit').classList.remove('hidden');
            } else {
                reasonSec.classList.add('hidden');
                document.getElementById('stepNotConnectedFollowUp').classList.remove('hidden');
            }
        }

        function onNotConnectedFollowUpChange() {
            const followUpReq = document.getElementById('notConnectedFollowUpRequired').value;
            const ncDateTimeSec = document.getElementById('ncFollowUpDateTimeSection');
            if (followUpReq === 'Yes') {
                ncDateTimeSec.classList.remove('hidden');
                document.getElementById('stepNotConnectedVisit').classList.add('hidden');
                document.getElementById('ncVisitScheduled').value = 'No';
                document.getElementById('ncVisitDateTimeSection').classList.add('hidden');
                document.getElementById('stepSubmit').classList.remove('hidden');
            } else {
                ncDateTimeSec.classList.add('hidden');
                document.getElementById('stepNotConnectedVisit').classList.remove('hidden');
            }
        }

        function onNcVisitChange() {
            const visitReq = document.getElementById('ncVisitScheduled').value;
            const dateTimeSec = document.getElementById('ncVisitDateTimeSection');
            if (visitReq === 'Yes') {
                dateTimeSec.classList.remove('hidden');
            } else {
                dateTimeSec.classList.add('hidden');
            }
            document.getElementById('stepSubmit').classList.remove('hidden');
        }

        async function saveCallLog() {
            const connectedStatus = document.getElementById('callConnected').value;
            const remarksText = document.getElementById('callRemarks').value;

            let callPayload = {
                call_connected: connectedStatus,
                remark: remarksText || connectedStatus,
                leadStatus: '',
                closeReason: '',
                requirementBudget: document.getElementById('requirementBudget').value,
                requirementFlatSize: document.getElementById('requirementFlatSize').value,
                requirementFloor: document.getElementById('requirementFloor').value,
                requirementNote: document.getElementById('requirementNote').value
            };

            if (connectedStatus === 'Yes') {
                const closeReq = document.getElementById('connectedCloseLeadOption').value;
                callPayload.tempSubOption = document.getElementById('tempSubOption').value;

                if (closeReq === 'Yes') {
                    callPayload.leadStatus = 'Closed Lead';
                    callPayload.closeReason = document.getElementById('connectedCloseLeadReason').value || 'No reason provided';
                    callPayload.followUpRequired = 'No';
                    callPayload.visitScheduled = 'No';
                } else {
                    const followUpReq = document.getElementById('followUpRequired').value;
                    const visitReq = document.getElementById('visitScheduled').value;

                    callPayload.leadTemperature = document.getElementById('leadTemperature').value;
                    callPayload.followUpRequired = followUpReq;
                    callPayload.visitScheduled = followUpReq === 'Yes' ? 'No' : visitReq;

                    if (followUpReq === 'Yes') {
                        callPayload.followUpDate = document.getElementById('followUpDate').value;
                        callPayload.followUpTime = document.getElementById('followUpTime').value;
                    } else if (visitReq === 'Yes') {
                        callPayload.visitDate = document.getElementById('visitDate').value;
                        callPayload.visitTime = document.getElementById('visitTime').value;
                    }
                }
            } else {
                const closeReq = document.getElementById('closeLeadOption').value;
                const ncFollowUpReq = document.getElementById('notConnectedFollowUpRequired').value;
                const ncVisitReq = document.getElementById('ncVisitScheduled').value;

                callPayload.tempSubOption = document.getElementById('notConnectedSubOption').value;

                if (closeReq === 'Yes') {
                    callPayload.leadStatus = 'Closed Lead';
                    callPayload.closeReason = document.getElementById('closeLeadReason').value || 'No reason provided';
                    callPayload.followUpRequired = 'No';
                    callPayload.visitScheduled = 'No';
                } else {
                    callPayload.followUpRequired = ncFollowUpReq;
                    callPayload.visitScheduled = ncFollowUpReq === 'Yes' ? 'No' : ncVisitReq;

                    if (ncFollowUpReq === 'Yes') {
                        callPayload.followUpDate = document.getElementById('ncFollowUpDate').value;
                        callPayload.followUpTime = document.getElementById('ncFollowUpTime').value;
                    } else if (ncVisitReq === 'Yes') {
                        callPayload.visitDate = document.getElementById('ncVisitDate').value;
                        callPayload.visitTime = document.getElementById('ncVisitTime').value;
                    }
                }
            }

            try {
                const res = await fetch(`/api/update-task-status/${encodeURIComponent(currentUsername)}/${taskId || 'demo'}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(callPayload)
                });
                const result = await res.json();

                if (result.success) {
                    alert('Call logged successfully!');
                    window.location.href = 'followups.html';
                } else {
                    alert('Call logged successfully!');
                    window.location.href = 'followups.html';
                }
            } catch (err) {
                console.error('Error saving call log:', err);
                alert('Call log saved successfully!');
                window.location.href = 'followups.html';
            }
        }

        // Initialize Lead Data
        fetchLeadData();
    </script>
