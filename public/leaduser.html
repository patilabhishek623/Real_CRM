<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User & Collection - Real_Crm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .corporate-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="min-h-full text-slate-800 flex flex-col selection:bg-blue-600 selection:text-white">

    <!-- Top Corporate Navigation Bar -->
    <header class="bg-white/85 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50 shadow-xs">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3.5">
                <div class="w-11 h-11 bg-gradient-to-br from-blue-600 to-indigo-700 rounded-xl flex items-center justify-center text-white shadow-md shadow-blue-600/25">
                    <i class="fa-solid fa-chart-line text-lg"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <span class="text-xl font-extrabold tracking-tight text-slate-900">Real_Crm</span>
                        <span class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-0.5 bg-blue-50 text-blue-700 rounded-md border border-blue-200">Team Lead Hub</span>
                    </div>
                    <span id="liveClock" class="text-xs text-slate-500 font-medium">Synchronizing system time...</span>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <span id="activeUserBadge" class="text-xs font-semibold bg-slate-50 text-slate-700 px-3.5 py-2.5 rounded-xl border border-slate-200 hidden sm:inline-flex items-center shadow-2xs"></span>
                <a href="/" onclick="handleLogout(event)" class="inline-flex items-center gap-2 px-4 py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-700 font-semibold text-xs rounded-xl transition border border-rose-200 shadow-2xs">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span class="hidden sm:inline">Logout</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-grow grid grid-cols-1 md:grid-cols-4 gap-8">
        
        <!-- Sidebar Navigation Menu -->
        <aside class="md:col-span-1 space-y-4">
            <div class="corporate-card rounded-2xl p-4 space-y-1.5 sticky top-28">
                <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400 px-3 mb-3">Navigation Menu</p>
                <a href="teamlead.html" class="flex items-center gap-3.5 px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 font-semibold rounded-xl text-sm transition group">
                    <i class="fa-solid fa-house w-5 text-slate-400 group-hover:text-blue-600 transition text-base"></i> Dashboard Overview
                </a>
                <a href="leaduser.html" class="flex items-center gap-3.5 px-4 py-3 bg-blue-600 text-white font-bold rounded-xl text-sm shadow-sm transition">
                    <i class="fa-solid fa-user-plus w-5 text-blue-100 text-base"></i> Add User & Collection
                </a>
                <a href="assigntaskteammember.html" class="flex items-center gap-3.5 px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 font-semibold rounded-xl text-sm transition group">
                    <i class="fa-solid fa-list-check w-5 text-slate-400 group-hover:text-blue-600 transition text-base"></i> Assign Task to Member
                </a>
            </div>
        </aside>

        <!-- Main Form Content -->
        <main class="md:col-span-2 space-y-6">
            <div class="corporate-card rounded-2xl p-8 space-y-6 shadow-sm">
                <div class="flex items-center gap-4 pb-5 border-b border-slate-100">
                    <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl border border-emerald-100 shadow-xs">
                        <i class="fa-solid fa-user-plus"></i>
                    </div>
                    <div>
                        <h2 class="text-xl font-extrabold text-slate-900">Create Team Member Account</h2>
                        <p class="text-xs text-slate-500 mt-0.5">Provision credentials & set up a dedicated MongoDB collection</p>
                    </div>
                </div>

                <form id="addMemberForm" class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">New Member Username</label>
                        <div class="relative">
                            <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                            <input type="text" id="newUsername" required placeholder="e.g. alex_smith" 
                                class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 focus:bg-white text-xs sm:text-sm transition">
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">New Member Password</label>
                        <div class="relative">
                            <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                            <input type="password" id="newPassword" required placeholder="••••••••" 
                                class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 focus:bg-white text-xs sm:text-sm transition">
                        </div>
                    </div>

                    <div class="pt-2">
                        <button type="submit" 
                            class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs sm:text-sm rounded-xl shadow-md shadow-emerald-600/20 transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-database"></i>
                            <span>Create Account & Provision Collection</span>
                        </button>
                    </div>
                </form>

                <div id="msg" class="hidden text-center text-xs font-semibold p-3.5 rounded-xl border"></div>
            </div>
        </main>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // Live Clock
        function updateClock() {
            const now = new Date();
            const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            const clockEl = document.getElementById('liveClock');
            if (clockEl) clockEl.textContent = now.toLocaleDateString('en-US', options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        const currentUsername = localStorage.getItem('crm_username');
        if (currentUsername) {
            const badge = document.getElementById('activeUserBadge');
            if (badge) badge.innerHTML = `<i class="fa-solid fa-user-shield text-blue-600 mr-1.5"></i> Lead: <b>${currentUsername}</b>`;
        }

        document.getElementById('addMemberForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('newUsername').value.trim();
            const password = document.getElementById('newPassword').value.trim();
            const msgDiv = document.getElementById('msg');
            msgDiv.textContent = '';
            msgDiv.classList.add('hidden');

            try {
                const response = await fetch('/api/add-member', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                msgDiv.classList.remove('hidden');
                if (data.success) {
                    msgDiv.className = 'text-center text-xs font-semibold p-3.5 rounded-xl border bg-emerald-50 text-emerald-700 border-emerald-200';
                    msgDiv.innerHTML = `<i class="fa-solid fa-circle-check mr-1.5"></i> ${data.message}`;
                    document.getElementById('addMemberForm').reset();
                } else {
                    msgDiv.className = 'text-center text-xs font-semibold p-3.5 rounded-xl border bg-rose-50 text-rose-700 border-rose-200';
                    msgDiv.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-1.5"></i> ${data.message || 'Failed to create member account.'}`;
                }
            } catch (err) {
                msgDiv.classList.remove('hidden');
                msgDiv.className = 'text-center text-xs font-semibold p-3.5 rounded-xl border bg-rose-50 text-rose-700 border-rose-200';
                msgDiv.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-1.5"></i> Server connection failed.`;
            }
        });

        function handleLogout(e) {
            e.preventDefault();
            localStorage.clear();
            window.location.href = '/';
        }
    </script>
</body>
</html>
