<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Attendance & Time Tracker - Real_Crm</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#f0fdf4', 500: '#10b981', 600: '#059669', 700: '#047857', 900: '#064e3b' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .corporate-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 12px -2px rgba(15, 23, 42, 0.05);
        }
    </style>
</head>
<body class="min-h-full text-slate-800 flex flex-col pb-24 md:pb-8 selection:bg-emerald-600 selection:text-white">

    <!-- Top Corporate Navigation Bar -->
    <header class="bg-white/95 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 sm:h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-emerald-600 to-teal-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-emerald-600/20">
                    <i class="fa-solid fa-business-time"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-xl font-black tracking-tight text-slate-900">Attendance Portal</h1>
                    <span id="liveClock" class="text-[10px] sm:text-xs text-slate-500 font-medium">Synchronizing...</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <a href="teammember.html" class="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition border border-slate-200">
                    <i class="fa-solid fa-arrow-left mr-1.5"></i> Dashboard
                </a>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="max-w-4xl mx-auto px-4 py-6 sm:py-10 w-full space-y-6">
        
        <!-- Status Card -->
        <div class="corporate-card rounded-2xl p-6 sm:p-8 text-center relative overflow-hidden space-y-6">
            <div class="absolute -right-12 -top-12 w-48 h-48 bg-emerald-500/10 rounded-full blur-2xl pointer-events-none"></div>
            
            <div>
                <span id="attendanceStatusBadge" class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-bold bg-slate-100 text-slate-600 border border-slate-200">
                    <span class="w-2.5 h-2.5 rounded-full bg-slate-400" id="statusDot"></span>
                    <span id="statusText">Not Punched In Today</span>
                </span>
                <h2 id="timerDisplay" class="text-4xl sm:text-6xl font-black tracking-tight text-slate-900 mt-4 font-mono">00:00:00</h2>
                <p class="text-xs sm:text-sm text-slate-500 mt-1">Total active working hours for today</p>
            </div>

            <!-- Action Buttons Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-4 border-t border-slate-200">
                <button onclick="handlePunchIn()" id="punchInBtn" class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-right-to-bracket"></i> Punch In
                </button>
                <button onclick="handleBreakToggle()" id="breakBtn" disabled class="w-full py-3.5 px-4 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl transition shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2 opacity-50 cursor-not-allowed">
                    <i class="fa-solid fa-mug-hot" id="breakIcon"></i> <span id="breakBtnText">Start Break</span>
                </button>
                <button onclick="handlePunchOut()" id="punchOutBtn" disabled class="w-full py-3.5 px-4 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl transition shadow-lg shadow-rose-600/20 flex items-center justify-center gap-2 opacity-50 cursor-not-allowed">
                    <i class="fa-solid fa-right-from-bracket"></i> Punch Out
                </button>
            </div>
        </div>

        <!-- Attendance History Table -->
        <div class="corporate-card rounded-2xl p-5 sm:p-6 space-y-4">
            <h3 class="font-bold text-slate-900 text-sm sm:text-base flex items-center gap-2">
                <i class="fa-solid fa-calendar-check text-emerald-600"></i> Your Attendance History
            </h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-200 text-[10px] sm:text-xs font-bold text-slate-400 uppercase">
                            <th class="py-3 px-3">Date</th>
                            <th class="py-3 px-3">Punch In</th>
                            <th class="py-3 px-3">Punch Out</th>
                            <th class="py-3 px-3">Break Time</th>
                            <th class="py-3 px-3">Working Hours</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody" class="text-xs sm:text-sm divide-y divide-slate-100">
                        <tr><td colspan="5" class="text-center py-6 text-slate-400">Loading history...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // Live Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('liveClock').textContent = now.toLocaleDateString('en-US', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        const currentUsername = localStorage.getItem('crm_username');
        if (!currentUsername) {
            window.location.href = '/';
        }

        let currentAttendance = null;
        let timerInterval = null;

        async function fetchAttendanceStatus() {
            try {
                const res = await fetch(`/api/attendance/${encodeURIComponent(currentUsername)}`);
                const data = await res.json();
                if (data.success) {
                    currentAttendance = data.today;
                    renderAttendanceState();
                    renderHistory(data.history);
                }
            } catch (err) {
                console.error('Error fetching attendance:', err);
            }
        }

        function renderAttendanceState() {
            const punchInBtn = document.getElementById('punchInBtn');
            const punchOutBtn = document.getElementById('punchOutBtn');
            const breakBtn = document.getElementById('breakBtn');
            const badge = document.getElementById('attendanceStatusBadge');
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            if (!currentAttendance || !currentAttendance.punchIn) {
                badge.className = "inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-bold bg-slate-100 text-slate-600 border border-slate-200";
                dot.className = "w-2.5 h-2.5 rounded-full bg-slate-400";
                text.textContent = "Not Punched In Today";
                
                punchInBtn.disabled = false;
                punchInBtn.className = "w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-2 cursor-pointer";
                
                punchOutBtn.disabled = true;
                punchOutBtn.className = "w-full py-3.5 px-4 bg-rose-600 text-white font-bold rounded-xl transition opacity-50 cursor-not-allowed";
                
                breakBtn.disabled = true;
                breakBtn.className = "w-full py-3.5 px-4 bg-amber-500 text-white font-bold rounded-xl transition opacity-50 cursor-not-allowed";
                
                document.getElementById('timerDisplay').textContent = "00:00:00";
                if (timerInterval) clearInterval(timerInterval);
            } else if (currentAttendance.punchIn && !currentAttendance.punchOut) {
                if (currentAttendance.isOnBreak) {
                    badge.className = "inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-bold bg-amber-50 text-amber-700 border border-amber-200";
                    dot.className = "w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse";
                    text.textContent = "Currently on Break";

                    breakBtn.innerHTML = `<i class="fa-solid fa-play"></i> Stop Break`;
                    breakBtn.disabled = false;
                    breakBtn.className = "w-full py-3.5 px-4 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-xl transition shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2 cursor-pointer";
                } else {
                    badge.className = "inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200";
                    dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
                    text.textContent = "Punched In & Active";

                    breakBtn.innerHTML = `<i class="fa-solid fa-mug-hot"></i> Start Break`;
                    breakBtn.disabled = false;
                    breakBtn.className = "w-full py-3.5 px-4 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl transition shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2 cursor-pointer";
                }

                punchInBtn.disabled = true;
                punchInBtn.className = "w-full py-3.5 px-4 bg-emerald-600 text-white font-bold rounded-xl transition opacity-50 cursor-not-allowed";

                punchOutBtn.disabled = false;
                punchOutBtn.className = "w-full py-3.5 px-4 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl transition shadow-lg shadow-rose-600/20 flex items-center justify-center gap-2 cursor-pointer";

                startTimer();
            } else {
                badge.className = "inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-bold bg-slate-100 text-slate-700 border border-slate-200";
                dot.className = "w-2.5 h-2.5 rounded-full bg-slate-500";
                text.textContent = "Punched Out for Today";

                punchInBtn.disabled = true;
                punchOutBtn.disabled = true;
                breakBtn.disabled = true;
                punchInBtn.className = punchOutBtn.className = breakBtn.className = "w-full py-3.5 px-4 bg-slate-300 text-slate-600 font-bold rounded-xl opacity-50 cursor-not-allowed";

                if (timerInterval) clearInterval(timerInterval);
                displayWorkingHours(currentAttendance);
            }
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!currentAttendance || !currentAttendance.punchIn || currentAttendance.isOnBreak) return;
                const punchInTime = new Date(currentAttendance.punchIn).getTime();
                const now = new Date().getTime();
                const totalElapsedMs = (now - punchInTime) - (currentAttendance.totalBreakMs || 0);
                
                const seconds = Math.floor((totalElapsedMs / 1000) % 60);
                const minutes = Math.floor((totalElapsedMs / (1000 * 60)) % 60);
                const hours = Math.floor(totalElapsedMs / (1000 * 60 * 60));

                document.getElementById('timerDisplay').textContent = 
                    `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }, 1000);
        }

        function displayWorkingHours(att) {
            if (!att.punchIn || !att.punchOut) return;
            const start = new Date(att.punchIn).getTime();
            const end = new Date(att.punchOut).getTime();
            const totalMs = (end - start) - (att.totalBreakMs || 0);
            const seconds = Math.floor((totalMs / 1000) % 60);
            const minutes = Math.floor((totalMs / (1000 * 60)) % 60);
            const hours = Math.floor(totalMs / (1000 * 60 * 60));
            document.getElementById('timerDisplay').textContent = 
                `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        async function handlePunchIn() {
            try {
                // Pass client's local time string to ensure accurate local timestamp storage
                const clientTime = new Date().toISOString();
                const res = await fetch(`/api/attendance/punch-in`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUsername, clientTime })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('Successfully punched in!', 'success');
                    fetchAttendanceStatus();
                } else {
                    showToast(data.message, 'error');
                }
            } catch (err) {
                showToast('Error connecting to server', 'error');
            }
        }

        async function handlePunchOut() {
            try {
                const res = await fetch(`/api/attendance/punch-out`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUsername })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('Successfully punched out!', 'success');
                    fetchAttendanceStatus();
                } else {
                    showToast(data.message, 'error');
                }
            } catch (err) {
                showToast('Error connecting to server', 'error');
            }
        }

        async function handleBreakToggle() {
            const endpoint = currentAttendance.isOnBreak ? '/api/attendance/stop-break' : '/api/attendance/start-break';
            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUsername })
                });
                const data = await res.json();
                if (data.success) {
                    showToast(currentAttendance.isOnBreak ? 'Break ended. Welcome back!' : 'Break started.', 'success');
                    fetchAttendanceStatus();
                }
            } catch (err) {
                showToast('Error toggling break', 'error');
            }
        }

        function renderHistory(history) {
            const tbody = document.getElementById('historyTableBody');
            if (!history || history.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-400">No attendance records found.</td></tr>`;
                return;
            }

            tbody.innerHTML = history.map(h => {
                const pIn = h.punchIn ? new Date(h.punchIn).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true }) : '-';
                const pOut = h.punchOut ? new Date(h.punchOut).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true }) : 'Active';
                const breakMins = Math.round((h.totalBreakMs || 0) / 60000);
                
                let workStr = '-';
                if (h.punchIn && h.punchOut) {
                    const dur = (new Date(h.punchOut) - new Date(h.punchIn)) - (h.totalBreakMs || 0);
                    const hrs = Math.floor(dur / (1000 * 60 * 60));
                    const mins = Math.floor((dur / (1000 * 60)) % 60);
                    workStr = `${hrs}h ${mins}m`;
                }

                return `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="py-3 px-3 font-bold text-slate-900">${h.date}</td>
                        <td class="py-3 px-3 text-emerald-600 font-semibold">${pIn}</td>
                        <td class="py-3 px-3 text-rose-600 font-semibold">${pOut}</td>
                        <td class="py-3 px-3 text-amber-600 font-semibold">${breakMins} mins</td>
                        <td class="py-3 px-3 font-black text-slate-900">${workStr}</td>
                    </tr>
                `;
            }).join('');
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg text-xs font-semibold bg-slate-900 border ${type === 'success' ? 'border-emerald-500/40 text-emerald-400' : 'border-rose-500/40 text-rose-400'}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-triangle-exclamation'}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        fetchAttendanceStatus();
    </script>
</body>
</html>
